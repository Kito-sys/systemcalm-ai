function techName(id,forAge){
  const tc=TECHNIQUES.filter(function(x){ return x.id===id; })[0];
  if(!tc) return id;
  const age = forAge || state.age;
  return (age==='child' && tc.nameChild) ? tc.nameChild[state.lang] : tc.name[state.lang];
}
function stats(p){
  const now=Date.now(), week=now-7*86400000, ses=p.sessions;
  const better=ses.filter(function(x){ return x.better; }).length;
  return { total:ses.length, week:ses.filter(function(x){ return x.t>=week; }).length,
    better:better, rate: ses.length?Math.round(100*better/ses.length):0,
    days: uniq(ses.map(function(x){ return dayKey(x.t); })).length };
}
function barRow(name,val,max,label){
  const w=max? Math.max(4, Math.round(100*val/max)) : 0;
  return '<div class="bar-row"><span class="bar-name" title="'+name+'">'+name+'</span>'+
    '<span class="bar-track"><span class="bar-fill" style="width:'+w+'%"></span></span>'+
    '<span class="bar-val">'+label+'</span></div>';
}
function colChart(items){
  const max=Math.max.apply(null,items.map(function(i){ return i.v; }).concat([1]));
  return items.map(function(i){
    const h=Math.max(3, Math.round(72*i.v/max));
    return '<div class="col" title="'+i.l+': '+i.v+'">'+
      '<span class="col-val">'+(i.v||'')+'</span>'+
      '<span class="col-bar" style="height:'+h+'px"></span>'+
      '<span class="col-lbl">'+i.l+'</span></div>';
  }).join('');
}

function summaryText(){
  const p=Store.all().filter(function(x){ return Store.slug(x.name)===state.viewProfile; })[0];
  if(!p) return '';
  const st=stats(p), L=t();
  const m={};
  p.sessions.forEach(function(x){ if(!m[x.tech]) m[x.tech]={n:0,b:0}; m[x.tech].n++; if(x.better) m[x.tech].b++; });
  const rank=Object.keys(m).map(function(k){ return {id:k,n:m[k].n,b:m[k].b}; })
    .sort(function(a,b){ return (b.b/b.n)-(a.b/a.n); });
  const ov={}, sta={};
  p.sessions.forEach(function(x){ ov[x.ov]=(ov[x.ov]||0)+1; sta[x.st]=(sta[x.st]||0)+1; });
  // Records from earlier builds carry no channel. Skip them rather than die:
  // a summary missing one line still gets the parent through the appointment.
  const top=function(o){
    const k=Object.keys(o).filter(function(x){ return x && x!=='undefined' && t().senses[x]; })
             .sort(function(a,b){ return o[b]-o[a]; })[0];
    return k ? t().senses[k].label+' ('+o[k]+')' : '—';
  };
  const times=p.sessions.map(function(x){ return x.t; }).filter(function(x){ return !!x; });
  const first=times.length ? new Date(Math.min.apply(null,times)).toLocaleDateString() : '—';
  return 'SystemCalm AI — '+L.sumFor+' '+(p.name||'—')+'\n'+
    L.sumPeriod+': '+first+' – '+new Date().toLocaleDateString()+'\n'+
    L.sumSessions+': '+st.total+' ('+st.week+' '+L.sumLast7+')\n'+
    L.sumBetter+': '+st.better+'/'+st.total+' ('+st.rate+'%)\n'+
    L.sumDays+': '+st.days+'\n'+
    L.sumOverload+': '+top(ov)+'\n'+
    L.sumAnchor+': '+top(sta)+'\n'+
    L.sumTop+': '+rank.slice(0,3).map(function(r){ return techName(r.id,p.age)+' '+r.b+'/'+r.n; }).join(', ')+'\n\n'+
    L.sumDisclaimer;
}

// Lets the finger actually draw on the path — touch protocols should feel touched
function enableFingerTrail(){
  const svg=el.stage.querySelector('.trace-svg'); if(!svg) return;
  let last=0;
  function draw(e){
    const now=e.timeStamp||performance.now();
    if(now-last<60) return; last=now;
    const r=svg.getBoundingClientRect(); if(!r.width) return;
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',(e.clientX-r.left)/r.width*300);
    c.setAttribute('cy',(e.clientY-r.top)/r.height*300);
    c.setAttribute('r',7); c.setAttribute('fill','rgba(45,212,191,.45)');
    c.style.transition='opacity 1.1s linear';
    svg.appendChild(c);
    requestAnimationFrame(function(){ c.style.opacity='0'; });
    setTimeout(function(){ c.remove(); },1200);
    Haptic.buzz(10);
  }
  svg.style.touchAction='none';
  svg.addEventListener('pointermove',draw,{passive:true});
  svg.addEventListener('pointerdown',draw,{passive:true});
}

/* ==================================================================
   9 · THE SESSION ENGINE — timed, auto-advancing
================================================================== */
const Session = {
  tech:null, phases:[], i:-1, running:false, raf:0,
  phaseStart:0, phaseEnd:0, total:0, elapsedBefore:0, pausedAt:0,
  audioNode:null, droneNode:null, tickTimer:0,

  channelAllows(ch){ return state.overload !== ch; },

  /* The seconds a cue really has: this phase, plus any that follow it too
     briefly to carry a cue of their own. An inhale cue spans the whole inhale,
     not just the first beat of it. */
  /* The aside belongs on a breath, not on top of one. Past the halfway mark,
     the first exhale long enough to hold it says it instead of its own cue:
     the animation still leads the breath, and the warm line lands where it
     was meant to rather than in the landing. */
  midDue(){
    if(this._mid || !this.phases || this.total<=90) return false;
    const done=this.elapsedBefore;
    if(done/this.total <= 0.48) return false;
    if(done/this.total > 0.75){ this._mid='gone'; return false; }
    const per = state.age==='child' ? 'child' : 'adult';
    const rec = VOICED[state.lang+'|'+per+'|mid'];
    const need = ((rec && rec.dur) || 3.5) + 0.3;
    if(this.voiceRoom(this.i) < need) return false;
    this._mid=true;
    return true;
  },

  voiceRoom(i){
    const ph=this.phases;
    if(!ph || !ph[i]) return 99;
    let room=ph[i].d;
    for(let j=i+1;j<ph.length;j++){
      if(ph[j].d>=1.2) break;
      room+=ph[j].d;
    }
    return room;
  },

  start(tech){
    this.stop(true);
    this.tech=tech;
    this.phases=tech.build(state.age, state.overload);
    this.total=this.phases.reduce((a,p)=>a+p.d,0);
    this.i=-1; this.elapsedBefore=0; this.running=true;

    // land the session instead of cutting it off
    if(this.phases.length && this.phases[this.phases.length-1].k==='done'){
      this.phases.splice(this.phases.length-1, 0, P('settle', state.length==='short'?14:22, {say:1}));
      this.total=this.phases.reduce(function(a,x){ return a+x.d; },0);
    }
    /* The greeting is the first thing the app ever says, and it is not a
       breathing cue — nothing is lost by letting the opening phase wait for it
       to finish, and a greeting chopped mid-sentence costs the whole first
       impression. */
    try{
      const per0 = state.age==='child' ? 'child' : 'adult';
      // soft mode is settled further down this function, so it is read from
      // the channel here rather than from the flag
      const soft0 = !this.channelAllows('auditory');
      const k0 = (state.age==='child' && soft0) ? 'readyQuiet' : 'ready';
      const r0 = RecVoice.on ? RecVoice.pick(RecVoice.id(state.lang,per0,k0)) : null;
      const need = (r0 && r0.dur) ? r0.dur+0.6 : 0;
      const p0 = this.phases[0];
      if(p0 && p0.k==='ready' && need > p0.d){ this.total += (need-p0.d); p0.d = need; }
    }catch(e){}
    this._mid=false; this._rest=false; this._cyc=0;
    this._waited=false; window.clearTimeout(this._endWait);
    this.pending={t:Date.now(), tech:tech.id, ov:state.overload, st:state.stable,
                  age:state.age, completed:false, secs:0, better:null};
    grantBadges(Store.profile());          // endowed progress: showing up already counts
    renderStage(tech.render, tech);
    if(tech.touch && tech.channel==='tactile') enableFingerTrail();
    el.techName.textContent = techLabel(tech);
    el.info.classList.add('hidden');

    // Channel-appropriate chrome
    const quiet = state.overload==='visual';
    el.veil.classList.toggle('on', quiet);
    setChrome(quiet);

    // Audio only when hearing is the anchor
    const useAudio = tech.channel==='auditory' && this.channelAllows('auditory');   // soundscape: still never
    // Hearing flooded no longer means silence — it means a quieter, slower voice
    // and no soundscape at all. A full mute is one tap away.
    Voice.soft = !this.channelAllows('auditory');
    this.voiceAllowed = true;
    Voice.autoMode();          // real words whenever this device has a voice for the language
    // pull the shipped lines for this persona into cache now, in session order
    try{ Voiced.warm(state.lang, state.age==='child'?'child':'adult'); }catch(e){}
    el.btnSound.classList.toggle('is-gone', !useAudio);
    el.volWrap.classList.toggle('hidden', !useAudio);
    el.volWrap.classList.toggle('flex', useAudio);
    el.btnVoice.classList.toggle('is-gone', !this.voiceAllowed || !Voice.supported);
    if(this.voiceAllowed){ Audio_.init(); Audio_.resume(); }
    if(useAudio){
      Audio_.init(); Audio_.resume(); Audio_.enabled=true; Audio_.setVol(el.vol.value/100);
      if(tech.audio==='swell' || tech.audio==='bed'){ this.audioNode=Audio_.bed('brown',480); Audio_.swell(this.audioNode, tech.audio==='bed'?0.5:0.12, 3); }
      if(tech.audio==='bed'){ this.droneNode=Audio_.drone(88); Audio_.swell(this.droneNode,0.18,4); }
      if(tech.audio==='hum'){ this.droneNode=Audio_.drone(118); }
      if(tech.audio==='binaural'){ this.audioNode=Audio_.binaural(200,6); Audio_.swell(this.audioNode,0.22,4); this.droneNode=Audio_.bed('brown',400); Audio_.swell(this.droneNode,0.06,4); }
      Audio_.fadeIn(3);
    }

    // Haptics only when touch is the anchor
    Haptic.enabled = tech.channel==='tactile' && this.channelAllows('tactile');

    // In child mode Calmi lives inside the stage, and progress is five stars
    el.sBuddy.classList.add('hidden'); el.sBuddy.innerHTML='';
    const kid = state.age==='child';
    const starBox=document.getElementById('stars');
    if(starBox){ starBox.classList.toggle('is-gone',!kid); if(kid){ mountStars(); setStars(0); } }
    if(kid) Calmi.quiet();

    showScreen('screen-session');
    setStep(0);
    syncVoiceUI();
    this.next();
    this.loop();
  },

  next(){
    this.i++;
    if(this.i>0) this.elapsedBefore += this.phases[this.i-1].d;
    if(this.i>=this.phases.length){ this.finish(); return; }
    const p=this.phases[this.i];
    this.phaseStart=performance.now();
    this.phaseEnd=this.phaseStart + p.d*1000;
    this.applyPhase(p);
    if(this.phases[this.i-1] && this.phases[this.i-1].k==='out') this._breath=(this._breath||0)+1;
  },

  applyPhase(p){
    const T=this.tech, lang=state.lang, c=state.age==='child';
    const L=t();
    let label='', sub='';

    switch(p.k){
      case 'ready':  label=L.getReady; sub=L.beginIn; break;
      case 'in':     label=L.inhale; break;
      case 'sip':    label=L.sip; break;
      case 'hold':   label=L.hold; break;
      case 'out':    label=L.exhale; break;
      case 'hum':    label=L.hum; break;
      case 'tense':  label=L.tense; sub=p.text?p.text[lang]:''; break;
      case 'release':label=L.release; sub=p.text?p.text[lang]:''; break;
      case 'press':  label=L.press; break;
      case 'soften': label=L.soften; break;
      case 'tapL':   label=L.tapL; break;
      case 'tapR':   label=L.tapR; break;
      case 'rest':   label=L.rest; break;
      case 'listen': label=L.listen; break;
      case 'beat':   label=L.rest; break;
      case 'follow': label=L.follow; break;
      case 'free':   label=L.free; break;
      case 'step':   label=''; sub=''; break;
      case 'settle': label=L.settleLbl; sub=L.settleSub; break;
      case 'done':   label=L.done; break;
    }
    // The big word says what to do; the small line says how. Children have
    // Calmi for this, adults had nothing.
    if(!c && !sub && L.subs && L.subs[p.k]) sub=L.subs[p.k];
    el.phase.textContent=label;
    el.sub.textContent=sub;

    // ---- visual response ----
    const dur=p.d;
    if(T.render==='orb'){
      const halo=el.stage.querySelector('.orb-halo'), ring=el.stage.querySelector('.orb-ring'), core=el.stage.querySelector('.orb-core');
      let scale = 0.55;
      if(p.k==='in') scale=0.92; else if(p.k==='sip') scale=1;
      else if(p.k==='hold') scale=1; else if(p.k==='out') scale=0.55;
      else if(p.k==='ready'||p.k==='done'||p.k==='settle') scale=0.72;
      [halo,ring,core].forEach(n=>{ if(!n) return;
        n.style.setProperty('--ph',dur+'s');
        n.style.transform='scale('+scale+')';
        n.style.opacity = (p.k==='out'?0.55:1);
      });
    }
    if(T.render==='press'){
      const box=document.getElementById('press-box'), lab=document.getElementById('press-label');
      if(box){
        box.style.setProperty('--ph',dur+'s');
        const tight=(p.k==='press'||p.k==='tense');
        box.style.transform='scale('+(tight?0.84:1)+')';
        box.style.borderColor= tight?'rgba(13,148,136,.6)':'rgba(20,184,166,.22)';
      }
      if(lab) lab.textContent = p.text?p.text[lang]:(label||'');
    }
    if(T.render==='pads'){
      const l=document.getElementById('pad-l'), r=document.getElementById('pad-r');
      if(l&&r){ l.classList.toggle('on',p.k==='tapL'); r.classList.toggle('on',p.k==='tapR'); }
    }
    if(T.render==='text'){
      const b=document.getElementById('big-text');
      if(b) b.textContent = p.text?p.text[lang]:(p.k==='ready'?L.getReady:(p.k==='done'?L.done:''));
    }

    // ---- audio response ----
    if(T.channel==='auditory' && this.channelAllows('auditory') && Audio_.enabled){
      if(T.audio==='swell'){
        if(p.k==='in'){ Audio_.swell(this.audioNode,0.55,dur); Audio_.sweep(this.audioNode,900,dur); }
        else if(p.k==='out'){ Audio_.swell(this.audioNode,0.07,dur); Audio_.sweep(this.audioNode,320,dur); }
      }
      if(T.audio==='hum'){
        if(p.k==='hum'){ Audio_.swell(this.droneNode,0.34,0.7); }
        else { Audio_.swell(this.droneNode,0.0001,0.8); }
        if(p.k==='in') Audio_.chime(392,1.4);
      }
      if(p.k==='done') Audio_.chime(528,3);
    }

    // ---- haptic response ----
    if(Haptic.enabled){
      if(p.k==='tapL'||p.k==='tapR') Haptic.buzz(140);
      else if(p.k==='tense'||p.k==='press') Haptic.buzz([90,120,90]);
      else if(p.k==='release'||p.k==='soften') Haptic.buzz(320);
      else if(p.k==='in') Haptic.buzz(60);
      else if(p.k==='out') Haptic.buzz([40,60,40]);
    }

    // ---- child mode: Calmi speaks, breathes and moves with the protocol ----
    if(c){ driveCalmi(p,T,dur); }

    // ---- adult spoken guidance ----
    // Adults get a spoken cue on every phase — a breathing protocol with one
    // opening sentence and then two minutes of silence is not guidance.
    if(!c && this.voiceAllowed && Voice.on && Voice.mode!=='off'){
      let line=adultLine(p,T,dur), midSwap=false;
      if(p.k==='out' && Session.midDue()){
        midSwap=true;
        line=(ADU.mid.sp && ADU.mid.sp[lang]) || line;
        Session._enc=-1;
      }
      // 'step' carries the whole instruction in its text, so it must be spoken
      // by the engine — a fixed recording cannot know what the step says.
      const cueKey = midSwap ? 'mid' : p.k;
      const canRec = p.k!=='step' && RecVoice.usable(lang,'adult',cueKey);
      if(line && (canRec || Voice.has(lang))){
        let ms;
        if(canRec){
          // the warm sentence is a line of its own, so a voiced exhale keeps it
          const encK=(p.k==='out' && Session._enc>=0) ? 'enc'+Session._enc : '';
          const encOk=encK && RecVoice.usable(lang,'adult',encK);
          ms=RecVoice.play(lang,'adult',cueKey,function(){
            if(encOk) RecVoice.play(lang,'adult',encK);
          },function(){
            if(Voice.has(lang)) Voice.say(line, lang, persona());
          },(Session._cyc||1)-1, Session.voiceRoom(Session.i))*1000+250;
          if(encOk) ms += (VOICED[lang+'|adult|'+encK].dur||2)*1000+200;
        }
        else { Voice.say(line, lang, persona()); ms=Math.min(dur*1000, line.length*95+900); }
        setSpeaking(true); try{ Native.tick(); }catch(e){}
        window.clearTimeout(Session._spk);
        Session._spk=window.setTimeout(function(){ setSpeaking(false); }, ms);
      }
    }
  },

  loop(){
    const self=this;
    cancelAnimationFrame(this.raf);
    (function frame(){
      if(!self.running) return;
      const now=performance.now();
      const p=self.phases[self.i];
      if(!p){ return; }

      // overall progress ring + countdown
      const done=(self.elapsedBefore + Math.min(p.d,(now-self.phaseStart)/1000));
      setRing(done/self.total);
      const left=Math.max(0,Math.ceil(self.total-done));
      el.timeLeft.textContent=fill(t().timeLeft,{s:left});
      if(state.age==='child') setStars(done/self.total);

      // continuous behaviours
      self.animate(p, (now-self.phaseStart)/1000);

      // a warm aside dropped on top of a breath cue cuts one of the two off
      /* The landing runs twenty seconds. Said once at the top and then
         nothing, it reads as the app having stopped rather than as quiet. */
      if(!self._rest && p.k==='settle' && p.d>=14 &&
         (now-self.phaseStart)/1000 > p.d*0.45 && !RecVoice.speaking() &&
         self.voiceAllowed && Voice.on && Voice.mode!=='off'){
        self._rest=true;
        const per2 = state.age==='child' ? 'child' : 'adult';
        if(RecVoice.usable(state.lang,per2,'rest')) RecVoice.play(state.lang,per2,'rest');
        else if(Voice.has(state.lang)) Voice.say(recText(per2,'rest',state.lang), state.lang, persona());
      }

      if(now>=self.phaseEnd){ self.next(); }
      self.raf=requestAnimationFrame(frame);
    })();
  },

  animate(p, tIn){
    const T=this.tech;
    const dt=Math.max(0,Math.min(0.1,(performance.now()-(this._lastT||performance.now()))/1000));
    this._lastT=performance.now();

    // moving light along a path
    if(T.render==='trace'){
      const path=document.getElementById('trace-guide'), dot=document.getElementById('trace-dot'), halo=document.getElementById('trace-halo');
      if(path&&dot&&path.getTotalLength){
        const len=path.getTotalLength();
        let frac=null;
        if(p.k==='follow'){
          const speed=p.slow ? (1 - 0.55*(this.elapsedBefore+tIn)/this.total) : 1;  // gradually decelerating
          this._tracePos=((this._tracePos||0) + 0.055*speed*dt) % 1;
          frac=this._tracePos;
        }else if(p.k==='in' || p.k==='out'){
          // one breath = one segment (a star point / a finger); in climbs it, out descends
          const segs=(T.path==='hand'||T.path==='star')?5:1;
          const seg=1/segs;
          const b=(this._breath||0)%segs;
          const within=Math.min(1,tIn/p.d);
          frac=(b*seg + (p.k==='in' ? within*seg*0.5 : seg*0.5 + within*seg*0.5)) % 1;
        }else if(p.k==='ready'||p.k==='done'||p.k==='hold'){
          frac=(this._lastFrac!=null)?this._lastFrac:0;
        }
        if(frac!=null){
          this._lastFrac=frac;
          const pt=path.getPointAtLength(len*frac);
          dot.setAttribute('cx',pt.x); dot.setAttribute('cy',pt.y);
          if(halo){ halo.setAttribute('cx',pt.x); halo.setAttribute('cy',pt.y); }
        }
      }
    }
    // tempo-based cues (chimes / heartbeat)
    if(p.tempo){
      const from=p.tempo[0], to=p.tempo[1];
      const prog=Math.min(1,tIn/p.d);
      const bpm=from+(to-from)*prog;
      const period=60/bpm;
      const n=Math.floor(tIn/period);
      if(n!==this._beatN){
        this._beatN=n;
        if(this.tech.channel==='auditory' && Audio_.enabled) Audio_.chime(430+ (n%2?0:60), 2.0);
        if(Haptic.enabled) Haptic.buzz(this.tech.beat?[60,110,90]:70);
      }
    }
  },

  pause(){
    if(!this.running) return;
    this.running=false; this.pausedAt=performance.now();
    cancelAnimationFrame(this.raf);
    Voice.stop(); Haptic.stop(); Audio_.duck(true);
    el.icoPause.classList.add('hidden'); el.icoPlay.classList.remove('hidden');
  },
  resume(){
    if(this.running||!this.tech) return;
    const gap=performance.now()-this.pausedAt;
    this.phaseStart+=gap; this.phaseEnd+=gap;
    this.running=true; Audio_.duck(false);
    el.icoPause.classList.remove('hidden'); el.icoPlay.classList.add('hidden');
    this.loop();
  },
  stop(silent){
    this.running=false; cancelAnimationFrame(this.raf);
    this._tracePos=0; this._breath=0; this._lastFrac=null; this._beatN=-1; this._lastT=0;
    if(state.age==='child') Calmi.quiet();
    Voice.stop(); Haptic.stop();
    Audio_.stopAll(); this.audioNode=null; this.droneNode=null;
    el.icoPause.classList.remove('hidden'); el.icoPlay.classList.add('hidden');
    if(!silent){ el.veil.classList.remove('on'); setChrome(false); }
  },
  finish(){
    /* The closing line is the last thing anyone hears, and tearing the session
       down on top of it cuts it mid-sentence. If it is still being said, the
       hand-off waits for it — bounded, so a stuck clip can never strand the
       session on the breathing screen. */
    if(!this._waited && RecVoice.speaking()){
      const self=this, left=Math.min(4000, Math.max(0, RecVoice.busyUntil-Date.now())+120);
      this._waited=true;
      this.running=false;
      window.clearTimeout(this._endWait);
      this._endWait=window.setTimeout(function(){ self.finish(); }, left);
      return;
    }
    this._waited=false;
    window.clearTimeout(this._endWait);
    if(this.pending){ this.pending.completed=true; this.pending.secs=Math.round(this.total); }
    this.stop(true);
    el.veil.classList.remove('on'); setChrome(false);
    state.sessions++;
    renderCheckin();
    showScreen('screen-checkin');
  }
};

// what the voice actually says for a phase
/* What the adult voice says at this phase. Returns '' for phases too short
   to speak over. */
function adultLine(p,T,dur){
  const lang=state.lang;
  if(p.k==='ready')   return ADU.ready.sp[lang];
  if(p.k==='step')    return (p.stext&&p.stext[lang]) || (p.text?p.text[lang]:'');
  if(p.k==='tense')   return (p.text?((p.stext&&p.stext[lang])||p.text[lang])+'. ':'')+ADU.tense.sp[lang];
  if(p.k==='release') return ADU.release.sp[lang];
  const A=ADU[p.k];
  if(!A || !A.sp) return '';
  if(p.k==='in') Session._cyc=(Session._cyc||0)+1;
  // after the first two breaths the "a little more" nudge is nagging, not guiding
  if(p.k==='sip' && (Session._cyc||0)>2) return '';
  let line=rot(A.sp[lang], (Session._cyc||1)-1);
  // one warm sentence every fourth exhale — the exhale is the long phase, so
  // it is the only one with room for a full sentence after the cue
  Session._enc=-1;
  if(p.k==='out' && Session._cyc>2 && Session._cyc%4===0 && dur>=4){
    const enc=ENCOURAGE[lang];
    // remembered, so that a voiced exhale can still carry it as its own clip
    Session._enc=(Math.floor(Session._cyc/4)-1) % enc.length;
    line = line + ' ' + enc[Session._enc];
  }
  // a cue that cannot finish before the phase does is noise, not guidance
  if(dur < 1 && p.k!=='sip' && p.k!=='hold') return '';
  return line;
}

function spokenFor(p,T){
  const L=t(), lang=state.lang, c=state.age==='child';
  if(p.k==='ready'){
    return c ? (lang==='he'
        ? 'היי. אני כאן איתך. נעשה את זה ביחד, לאט לאט.'
        : 'Hi. I am right here with you. We will do this together, nice and slow.')
      : (lang==='he'
        ? 'אני כאן. אפשר להוריד את הכתפיים. נעשה את זה לאט. אין שום דבר שצריך לעשות נכון.'
        : 'I am here. Let your shoulders drop. We will take this slowly. There is nothing you need to get right.');
  }
  if(p.k==='tense') return (p.text?p.text[lang]:'') + '. ' + L.tense;
  if(p.k==='release') return (lang==='he'?'לשחרר. לשים לב כמה זה שונה עכשיו.':'Let go. Notice how different that feels.');
  if(p.k==='step') return p.text?p.text[lang]:'';
  if(p.k==='rest') return lang==='he'?'לנוח רגע. לתת לזה לשקוע.':'Rest a moment. Let that settle.';
  if(p.k==='settle') return lang==='he'
    ? 'זהו. עכשיו פשוט להישאר כאן רגע. בלי לעשות כלום. לתת לגוף לסיים לבד.'
    : 'That is it. Stay here a moment now. Nothing to do. Let your body finish on its own.';
  return p.text?p.text[lang]:'';
}

function techLabel(tech){
  if(state.age==='child' && tech.nameChild) return tech.nameChild[state.lang];
  return tech.name[state.lang];
}

/* ==================================================================
   10 · ROUTING — pick techniques that use the stable channel only
================================================================== */
function buildQueue(){
  const list=TECHNIQUES.filter(tc=>
    tc.channel===state.stable &&
    tc.ages.indexOf(state.age)>=0 &&
    (!tc.needsVoice || Voice.supported)
  );
  // Put the strongest evidence first, keep the rest as the "not yet" fallbacks.
  const rank={strong:0,moderate:1,weak:2};
  list.sort((a,b)=>rank[a.ev]-rank[b.ev]);
  // Rotate so repeat sessions don't open with the same one. The count must come
  // from the stored history: an in-memory counter resets on every reload, and
  // only ever moved when a session ran all the way to its own end.
  let done=0;
  try{
    const pr=Store.mem.profiles[Store.slug(state.name)];
    done=(pr && pr.sessions) ? pr.sessions.length : 0;
  }catch(e){ done=0; }
  const off=(done + state.sessions) % Math.max(1,list.length);
  state.queue=list.slice(off).concat(list.slice(0,off));
  state.qi=0;
}
function runCurrent(){
  if(!state.queue.length) buildQueue();
  const tech=state.queue[state.qi % state.queue.length];
  Session.start(tech);
  renderInfo(tech);
}
function runNext(){
  state.qi++;
  el.phase.textContent=t().nextTechnique;
  setTimeout(runCurrent,600);
}

/* The background film scrubs with the pointer. It runs on the entry
   screens only: a session is the one place in this product where moving
   images are the problem rather than the atmosphere, so it is cut there,
   and whenever sight is the flooded channel, or the device asks for less
   motion. */
const Film = {
  el:null, prevX:null, target:0, seeking:false, ready:false, allowed:true,
  init(){
    this.el=document.getElementById('bg-video');
    if(!this.el) return;
    const self=this;
    this.el.addEventListener('loadedmetadata',function(){ self.ready=true; self.target=self.el.duration*0.25;
      try{ self.el.currentTime=self.target; }catch(e){} });
    this.el.addEventListener('seeked',function(){
      self.seeking=false;
      if(Math.abs(self.el.currentTime-self.target)>0.02) self.seek();
    });
    window.addEventListener('mousemove',function(e){ self.move(e.clientX); },{passive:true});
    window.addEventListener('touchmove',function(e){
      if(e.touches&&e.touches[0]) self.move(e.touches[0].clientX);
    },{passive:true});
  },
  move(x){
    if(!this.ready || !this.allowed || !this.el.duration) { this.prevX=x; return; }
    if(this.prevX===null){ this.prevX=x; return; }
    const delta=x-this.prevX; this.prevX=x;
    const SENSITIVITY=0.8;
    const off=(delta/window.innerWidth)*SENSITIVITY*this.el.duration;
    this.target=Math.max(0, Math.min(this.el.duration, this.target+off));
    if(!this.seeking) this.seek();
  },
  seek(){
    this.seeking=true;
    try{ this.el.currentTime=this.target; }catch(e){ this.seeking=false; }
  },
  set(on){
    this.allowed=!!on;
    document.body.setAttribute('data-film', on?'on':'off');
  }
};
function syncFilm(){
  let reduce=false;
  try{ reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  const inSession=document.body.getAttribute('data-view')==='session';
  Film.set(!reduce && !inSession && state.overload!=='visual');
}

/* ---- SHA-256, so a password is never stored as typed ---- */
const SHA_K=[], SHA_H=[];
(function(){
  let n=2, c=0;
  while(c<64){
    let p=true; for(let i=2;i*i<=n;i++){ if(n%i===0){ p=false; break; } }
    if(p){ if(c<8) SHA_H[c]=(Math.pow(n,.5)%1)*4294967296|0; SHA_K[c]=(Math.pow(n,1/3)%1)*4294967296|0; c++; }
    n++;
  }
})();
function sha256hex(s){
  const m=unescape(encodeURIComponent(s)), l=m.length*8, w=[];
  for(let i=0;i<m.length;i++) w[i>>2]|=m.charCodeAt(i)<<(24-(i%4)*8);
  w[l>>5]|=0x80<<(24-l%32);
  w[(((l+64)>>9)<<4)+15]=l;
  const H=SHA_H.slice();
  for(let j=0;j<w.length;j+=16){
    const a=H.slice(), W=[];
    for(let t=0;t<64;t++){
      if(t<16) W[t]=w[j+t]|0;
      else{
        const g0=W[t-15], g1=W[t-2];
        W[t]=(W[t-16]+(((g0>>>7)|(g0<<25))^((g0>>>18)|(g0<<14))^(g0>>>3))+W[t-7]+(((g1>>>17)|(g1<<15))^((g1>>>19)|(g1<<13))^(g1>>>10)))|0;
      }
      const e=a[4], q=a[0];
      const t1=(a[7]+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&a[5])^(~e&a[6]))+SHA_K[t]+W[t])|0;
      const t2=((((q>>>2)|(q<<30))^((q>>>13)|(q<<19))^((q>>>22)|(q<<10)))+((q&a[1])^(q&a[2])^(a[1]&a[2])))|0;
      a.unshift((t1+t2)|0); a[4]=(a[4]+t1)|0; a.pop();
    }
    for(let i=0;i<8;i++) H[i]=(H[i]+a[i])|0;
  }
  return H.map(function(x){ return ('00000000'+(x>>>0).toString(16)).slice(-8); }).join('');
}

/* ---- accounts: kept on this device, passwords stored only as salted hashes ---- */
const Auth = {
  K_ACC:'systemcalm.accounts', K_SES:'systemcalm.session', K_LEG:'systemcalm.legacy',
  accounts:[], cur:null, persists:true, fails:{}, tab:'in', err:null, mem:{},
  get(store,k){ try{ return window[store].getItem(k); }catch(e){ return this.mem[store+k]||null; } },
  set(store,k,v){ try{ window[store].setItem(k,v); return true; }catch(e){ this.mem[store+k]=v; return false; } },
  del(store,k){ try{ window[store].removeItem(k); }catch(e){} delete this.mem[store+k]; },
  load(){
    let raw=this.get('localStorage',this.K_ACC);
    try{ this.accounts=raw?(JSON.parse(raw)||[]):[]; }catch(e){ this.accounts=[]; }
    try{ window.localStorage.setItem('systemcalm.probe','1'); window.localStorage.removeItem('systemcalm.probe'); this.persists=true; }
    catch(e){ this.persists=false; }
  },
  save(){ if(!this.set('localStorage',this.K_ACC,JSON.stringify(this.accounts))) this.persists=false; },
  norm(u){ return String(u||'').trim().toLowerCase(); },
  salt(){
    let s='';
    try{ const a=new Uint8Array(12); window.crypto.getRandomValues(a); for(let i=0;i<a.length;i++) s+=('0'+a[i].toString(16)).slice(-2); }
    catch(e){ for(let i=0;i<24;i++) s+=Math.floor(Math.random()*16).toString(16); }
    return s;
  },
  hash(pw,salt){ let h=sha256hex(salt+':'+pw); for(let i=0;i<2500;i++) h=sha256hex(h+salt+pw); return h; },
  find(u){ const k=this.norm(u); return this.accounts.filter(function(a){ return a.user===k; })[0]||null; },
  check(user,pw,pw2,up){
    const u=String(user||'').trim();
    if(u.length<3) return ['errUserShort'];
    if(!/^[\w.\-֐-׿]+$/.test(u)) return ['errUserBad'];
    if(!pw || pw.length<6) return ['errPassShort'];
    if(up && pw!==pw2) return ['errPassMatch'];
    return null;
  },
  signUp(user,pw,pw2,keep){
    const bad=this.check(user,pw,pw2,true); if(bad) return bad;
    if(this.find(user)) return ['errTaken'];
    const id='u'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);
    const salt=this.salt();
    // the first account on a device inherits whatever was saved before accounts existed
    const claimed=this.get('localStorage',this.K_LEG)==='1';
    const a={id:id, user:this.norm(user), shown:String(user).trim(), salt:salt, hash:this.hash(pw,salt), ns:claimed?id:'', created:Date.now()};
    this.accounts.push(a); this.save();
    this.set('localStorage',this.K_LEG,'1');
    this.enter(a,keep);
    return null;
  },
  signIn(user,pw,keep){
    const k=this.norm(user);
    if(k.length<1 || !pw) return ['errLogin'];
    const f=this.fails[k]||{n:0,until:0};
    const now=Date.now();
    if(f.until>now) return ['errWait',{s:Math.ceil((f.until-now)/1000)}];
    const a=this.find(user);
    if(!a || this.hash(pw,a.salt)!==a.hash){
      f.n++; if(f.n>=5){ f.until=now+30000; f.n=0; }
      this.fails[k]=f;
      return ['errLogin'];
    }
    this.fails[k]={n:0,until:0};
    this.enter(a,keep);
    return null;
  },
  erase(user){
    const a=this.find(user); if(!a) return ['errNoAcct'];
    this.accounts=this.accounts.filter(function(x){ return x!==a; }); this.save();
    try{ window.localStorage.removeItem(a.ns?('systemcalm.v2.'+a.ns):'systemcalm.v1'); }catch(e){}
    try{ window.localStorage.removeItem('systemcalm.voice'+(a.ns?'.'+a.ns:'')); }catch(e){}
    try{ window.indexedDB.deleteDatabase('systemcalm-voice'+(a.ns?'-'+a.ns:'')); }catch(e){}
    return null;
  },
  enter(a,keep){
    this.cur=a;
    this.del('localStorage',this.K_SES); this.del('sessionStorage',this.K_SES);
    this.set(keep?'localStorage':'sessionStorage',this.K_SES,a.id);
    Store.key=a.ns?('systemcalm.v2.'+a.ns):'systemcalm.v1';
    Store.mem={profiles:{}}; Store.persists=true; Store.read();
    if(RecVoice.db){ try{ RecVoice.db.close(); }catch(e){} }
    RecVoice.ns=a.ns||''; RecVoice.clips={}; RecVoice.db=null; RecVoice.where='mem'; RecVoice.ready=false; RecVoice.failed={};
    try{ RecVoice.load(); }catch(e){}
    const pf=Store.mem.prefs||{};
    state.calmiName=pf.calmiName||'';
    RecVoice.src=(pf.voiceSrc && pf.voiceSrc!=='off')?pf.voiceSrc:'auto';

  },
  signOut(){

  },
  boot(){

const Chat = {
  log:[], flow:null, step:0, riddle:null, seq:{}, busy:false, speak:false, started:false, recog:null, _tw:0, _to:0,
  T(){ return CHAT[state.lang]; },
  fx(s){ return String(s).replace(/\{n\}/g,firstName()).replace(/\{c\}/g,calmiName()); },
  rot(key,arr){ const i=(this.seq[key]||0); this.seq[key]=i+1; return arr[i%arr.length]; },
  reset(){
    this.log=[]; this.flow=null; this.step=0; this.riddle=null; this.seq={}; this.busy=false; this.started=false;
    window.clearInterval(this._tw); window.clearTimeout(this._to);
    const lg=document.getElementById('chat-log'); if(lg) lg.innerHTML='';
    const ch=document.getElementById('chat-chips'); if(ch) ch.innerHTML='';
  },
  node(){ return document.querySelector('#chat-calmi .calmi'); },
  refreshHead(){
    const L=tr();
    const nmEl=document.getElementById('chat-name'); if(nmEl) nmEl.textContent=calmiName();
    const sub=document.getElementById('chat-sub'); if(sub) sub.textContent=L.chatSub;
    const inp=document.getElementById('chat-input'); if(inp) inp.placeholder=L.chatPlaceholder;
    const send=document.getElementById('chat-send'); if(send) send.setAttribute('aria-label',L.chatSend);
    const mic=document.getElementById('chat-mic'); if(mic) mic.setAttribute('aria-label',L.chatMic);
    const box=document.getElementById('chat-calmi');
    if(box && !box.firstChild){ box.innerHTML=calmiSVG('happy',84); }
    else if(box){ const s=box.querySelector('svg'); if(s) s.setAttribute('aria-label',calmiName()); }
    $$('#screen-chat [data-i18n]').forEach(function(n){ const v=L[n.dataset.i18n]; if(typeof v==='string') n.textContent=v; });
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(mic) mic.classList.toggle('is-gone',!SR);
  },
  open(){
    this.refreshHead();
    if(!this.started){ this.started=true; this.start(); }
    window.setTimeout(function(){ const i=document.getElementById('chat-input'); try{ i.focus({preventScroll:true}); }catch(e){} },700);
  },
  start(){
    const T=this.T();
    this.say(this.fx(this.rot('hello',T.hello)),['feel','talk','joke','riddle','ground','calm']);
  },
  /* a message in the log */
  add(who,text){
    const lg=document.getElementById('chat-log'); if(!lg) return null;
    const d=document.createElement('div'); d.className='msg '+who; d.textContent=text; lg.appendChild(d);
    lg.scrollTop=lg.scrollHeight; return d;
  },
  chips(ids,opts){
    const box=document.getElementById('chat-chips'); if(!box) return;
    box.innerHTML='';
    const T=this.T();
    (ids||[]).forEach(function(id){
      const b=document.createElement('button'); b.type='button'; b.dataset.chat=id;
      b.textContent=(opts&&opts[id])||T.chips[id]||id; box.appendChild(b);
    });
  },
  /* Calmi says something: dots, then the words appear a few at a time */
  say(text,chipIds,after,chipLabels){
    const self=this, lg=document.getElementById('chat-log'); if(!lg) return;
    this.busy=true; this.chips([]);
    const calmi=this.node();
    const dots=document.createElement('div'); dots.className='msg bot typing'; dots.innerHTML='<i></i><i></i><i></i>'; lg.appendChild(dots);
    lg.scrollTop=lg.scrollHeight;
    let reduce=false; try{ reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
    window.clearTimeout(this._to);
    this._to=window.setTimeout(function(){
      dots.remove();
      const d=self.add('bot','');
      if(calmi) calmi.classList.add('talking');
      const fin=function(){
        if(d) d.textContent=text;
        if(calmi) calmi.classList.remove('talking');
        self.busy=false;
        self.chips(chipIds,chipLabels);
        if(self.speak) self.voice(text);
        if(after) after();
      };
      if(reduce || text.length<2){ fin(); return; }
      let i=0; const step=Math.max(1,Math.ceil(text.length/90));
      window.clearInterval(self._tw);
      self._tw=window.setInterval(function(){
        i+=step; if(d) d.textContent=text.slice(0,i); lg.scrollTop=lg.scrollHeight;
        if(i>=text.length){ window.clearInterval(self._tw); fin(); }
      },24);
    }, reduce?0:520);
  },
  voice(text){
    try{ if(Voice.has(state.lang)){ Voice.unlock(); Voice.say(text,state.lang,'child'); } }catch(e){}
  },
  /* what the child sends: a chip or typed words */
  send(text,label){
    if(this.busy) return;
    const t=String(text||'').trim(); if(!t) return;
    this.add('me',label||t);
    const inp=document.getElementById('chat-input'); if(inp) inp.value='';
    this.chips([]);
    this.reply(t);
  },
  chip(id,label){
    if(this.busy) return;
    this.add('me',label||id); this.chips([]); this.act(id);
  },
  mood(id){
    const m=this.T().mood[id]; if(!m) return false;
    const c=this.node(); if(c) c.setAttribute('data-mood',(id==='tired'||id==='sad')?'sleepy':'happy');
    this.say(m[0],m[1]); return true;
  },
  act(id){
    const T=this.T();
    if(this.flow==='riddle' && id.indexOf('ans')===0){
      const r=this.riddle, pick=+id.slice(3);
      this.flow=null;
      if(pick===r.a){ const c=this.node(); if(c){ c.classList.add('cheer'); window.setTimeout(function(){ c.classList.remove('cheer'); },1500); }
        this.say(this.rot('right',T.right),['riddle','joke','menu']); }
      else this.say(T.wrong,['riddle','joke','menu']);
      return;
    }
    if(T.mood[id]){ this.mood(id); return; }
    switch(id){
      case 'feel': this.say(T.ask,['happy','sad','angry','scared','tired','over']); break;
      case 'talk': this.say(T.talk,['feel','joke','menu']); break;
      case 'tell': this.say(T.tell,['calm','joke']); break;
      case 'joke': this.say(this.rot('joke',T.jokes),['again','riddle','menu'],null,{again:T.chips.again}); this.seqJoke=true; break;
      case 'again': this.act(this.lastKind==='riddle'?'riddle':'joke'); return;
      case 'riddle': this.askRiddle(); break;
      case 'ground': this.flow='ground'; this.step=0; this.say(T.ground[0],[]); break;
      case 'calm': this.say(T.calm,[],function(){ window.setTimeout(function(){ Chat.startCalm(); },900); }); break;
      case 'yes': this.act('calm'); return;
      case 'no': case 'menu': this.say(T.menu,['feel','talk','joke','riddle','ground','calm']); break;
      default: this.say(T.menu,['feel','talk','joke','riddle','ground','calm']);
    }
    if(id==='joke') this.lastKind='joke';
  },
  askRiddle(){
    const T=this.T(); const r=this.rot('riddle',T.riddles);
    this.riddle=r; this.flow='riddle'; this.lastKind='riddle';
    const lab={}; const ids=[]; r.o.forEach(function(o,i){ lab['ans'+i]=o; ids.push('ans'+i); });
    this.say(r.q,ids,null,lab);
  },
  startCalm(){
    state.age='child';
    try{ renderIntake(); renderBuddyIntro(); }catch(e){}
    setStep(2); showScreen('screen-intake-2');
  },
  reply(text){
    const T=this.T(), rx=T.rx, s=text.toLowerCase();
    if(rx.safe.test(s)){ this.flow=null; this.say(T.safe,['calm','menu']); return; }
    if(this.flow==='riddle' && this.riddle){
      const r=this.riddle, hit=r.o.map(function(o){ return o.toLowerCase(); }).indexOf(s.trim());
      if(hit>=0){ this.act('ans'+hit); return; }
      this.flow=null;
    }
    if(this.flow==='ground'){
      this.step++;
      if(this.step<T.ground.length-1){ this.say(T.ground[this.step],[]); return; }
      this.flow=null; this.say(T.ground[T.ground.length-1],['yes','no']); return;
    }
    const kinds=['over','scared','angry','sad','tired','happy'];
    for(let i=0;i<kinds.length;i++){ if(rx[kinds[i]].test(s)){ this.mood(kinds[i]); return; } }
    if(rx.joke.test(s)){ this.act('joke'); return; }
    if(rx.game.test(s)){ this.act('riddle'); return; }
    if(rx.breath.test(s)){ this.act('calm'); return; }
    if(rx.who.test(s)){ this.say(this.fx(T.who),['menu']); return; }
    if(rx.thanks.test(s)){ this.say(this.rot('thanks',T.thanks),['menu']); return; }
    if(rx.bye.test(s)){ this.say(this.rot('bye',T.bye),['menu']); return; }
    if(rx.bored.test(s)){ this.say(this.rot('bored',T.bored),['joke','riddle']); return; }
    if(rx.hi.test(s)){ this.say(this.rot('hi',T.hi),['feel','talk','joke']); return; }
    this.say(this.rot('def',T.def),['calm','joke','menu']);
  },
  mic(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return;
    const btn=document.getElementById('chat-mic');
    if(this.recog){ try{ this.recog.stop(); }catch(e){} return; }
    let r; try{ r=new SR(); }catch(e){ return; }
    r.lang=(state.lang==='he')?'he-IL':'en-US'; r.interimResults=false; r.maxAlternatives=1;
    const self=this;
    r.onresult=function(e){ try{ const tx=e.results[0][0].transcript; if(tx) self.send(tx); }catch(x){} };
    r.onend=function(){ self.recog=null; if(btn) btn.classList.remove('live'); };
    r.onerror=function(){ self.recog=null; if(btn) btn.classList.remove('live'); };
    try{ r.start(); this.recog=r; if(btn) btn.classList.add('live'); }catch(e){ this.recog=null; }
  }
};

/* ---- the voice screen: pick a voice, or record your own ---- */
function voiceChoice(){
  const lang=studioLang(), per=Studio.persona;
  if(Voice.mode==='off') return 'off';
  const s=RecVoice.src||'auto';
  if(s!=='auto') return s;
  if(RecVoice.count(lang,per)>0) return 'mine';
  if(Voiced.count(lang,per)>0) return 'shipped';
  return 'device';
}
function chooseVoice(c){
  Voice.userSet=true;
  if(c==='off'){ Voice.mode='off'; try{ Voice.stop(); RecVoice.stop(); }catch(e){} }
  else{ if(Voice.mode==='off') Voice.mode='human'; Voice.on=true; RecVoice.src=c; }
  savePrefs({voiceSrc:c});
  try{ syncToggles(); syncVoiceUI(); }catch(e){}
}
function hearVoice(which){
  Voice.unlock();
  try{ Voice.stop(); RecVoice.stop(); }catch(e){}
  const lang=studioLang(), per=Studio.persona, kid=(per==='child');
  const L=tr();
  const text=kid?L.voiceSampleChild:L.voiceSampleAdult;
  const prev=RecVoice.src, prevMode=Voice.mode, prevOn=Voice.on;
  const done=function(){ RecVoice.src=prev; };
  if(which==='device'){
    Voice.mode='human'; Voice.on=true;
    Voice.say(text,lang,kid?'child':'therapist');
    Voice.mode=prevMode; Voice.on=prevOn;
    return;
  }
  let key=(kid && state.calmiName)?'in':'ready';
  if(which==='mine'){
    key=REC_KEYS[per].filter(function(k){ return !!RecVoice.clips[RecVoice.id(lang,per,k)]; })[0];
    if(!key) return;
  }
  RecVoice.src=which;
  const wasOn=RecVoice.on; RecVoice.on=true;
  RecVoice.play(lang,per,key,null,function(){
    Studio.msg=(lang==='he')?'ההקלטה לא נטענה (בדקו חיבור לאינטרנט).':'The recording could not be loaded (check your connection).';
    renderStudio();
  },0,null);
  RecVoice.on=wasOn; done();
}
function renderStudio(){
  const L=tr(), lang=studioLang(), per=Studio.persona, kid=(per==='child');
  const box=document.getElementById('studio-body'); if(!box) return;
  const ttl=document.getElementById('voice-title'), sub=document.getElementById('voice-sub');
  if(ttl) ttl.textContent=kid?L.vsTitleKid:L.vsTitleAdult;

  const hasShipped=Voiced.count(lang,per)>0;
  const lines=REC_KEYS[per].map(function(k){ return {k:k,id:RecVoice.id(lang,per,k),txt:recText(per,k,lang)}; }).filter(function(x){ return !!x.txt; });
  const nDone=lines.filter(function(l){ return !!RecVoice.clips[l.id]; }).length;
  const cur=voiceChoice();
  const ico=function(p){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'; };
  const hear=function(w){ return '<button type="button" class="hear" data-vhear="'+w+'">'+ico('<path d="M4 9.5v5h3.2L12 18.6V5.4L7.2 9.5H4Z"/><path d="M15.6 9.2a4 4 0 0 1 0 5.6"/>')+L.vsHear+'</button>'; };
  const opt=function(id,title,desc,extra,hearBtn,tag){
    return '<div class="vopt" role="radio" tabindex="0" aria-checked="'+(cur===id?'true':'false')+'" data-vsrc="'+id+'">'+
      '<span class="rd"></span><div class="tx"><b>'+title+(tag?'<span class="tag'+(tag.soft?' soft':'')+'">'+tag.t+'</span>':'')+'</b><span class="d">'+desc+'</span>'+(extra||'')+'</div>'+(hearBtn||'')+'</div>';
  };
  let devSel='';
  if(Voice.supported){
    const list=Voice.listFor(lang);
    if(list.length>1){
      devSel='<select class="vsel" id="vs-device" aria-label="'+esc(L.vsPickDevice)+'"><option value="">'+esc(L.vsDeviceDefault)+'</option>'+
        list.map(function(v){ return '<option value="'+esc(v.voiceURI)+'"'+(Voice.chosenBy[lang]===v.voiceURI?' selected':'')+'>'+esc(v.name)+'</option>'; }).join('')+'</select>';
    }
  }
  let h='<div>';
  /* step 1 */
  h+='<section class="vs-sec"><h3 class="vs-h"><span class="vs-n">1</span>'+L.vsStep1+'</h3><div class="space-y-2.5 mt-3" role="radiogroup" aria-label="'+esc(L.vsStep1)+'">';
  if(hasShipped) h+=opt('shipped',L.vsShipped,L.vsShippedD,'',hear('shipped'),{t:L.vsRecommended});
  if(Voice.supported) h+=opt('device',L.vsDevice,L.vsDeviceD,devSel,hear('device'));
  h+=opt('mine',L.vsMine,nDone?fill(L.vsMineD,{n:nDone,m:lines.length}):L.vsMineNone,'',nDone?hear('mine'):'');
  h+=opt('off',L.vsOff,L.vsOffD,'','');
  h+='</div></section>';
  /* step 2 */
  h+='<section class="vs-sec"><h3 class="vs-h"><span class="vs-n">2</span>'+L.vsStep2+'</h3>';
  h+='<div class="flex flex-wrap items-center gap-3 mt-3 mb-3">';
  if(!state.age){
    h+='<span class="vs-p" style="margin:0">'+L.vsWho+'</span><div class="vs-seg">'+
      '<button type="button" data-studio-per="child" aria-pressed="'+(kid?'true':'false')+'">'+L.vsForKid+'</button>'+
      '<button type="button" data-studio-per="adult" aria-pressed="'+(!kid?'true':'false')+'">'+L.vsForAdult+'</button></div>';
  } else {
    h+='<span class="vs-p" style="margin:0">'+L.vsFor+' <b>'+(kid?L.vsForKid:L.vsForAdult)+'</b></span>';
  }
  h+='<div class="vs-seg" role="group" aria-label="'+esc(L.vsLangLbl)+'"><button type="button" data-studio-lang="he" aria-pressed="'+(lang==='he'?'true':'false')+'">עברית</button>'+
     '<button type="button" data-studio-lang="en" aria-pressed="'+(lang==='en'?'true':'false')+'">English</button></div></div>';
  if(!lines.length){ h+='<p class="vs-p">'+L.vsNoLines+'</p>'; }
  else if(!RecVoice.supported){ h+='<p class="vs-p">'+L.studioNoMic+'</p>'; }
  else{
    let next=lines.filter(function(l){ return !RecVoice.clips[l.id] && !Studio.skipped[l.k]; })[0];
    if(!next && nDone<lines.length){ Studio.skipped={}; next=lines.filter(function(l){ return !RecVoice.clips[l.id]; })[0]; }
    h+='<div class="card rec-card">';
    if(!next){
      h+='<div class="rec-ok">'+ico('<path d="M20 6 9 17l-5-5"/>')+'<span>'+L.vsAllDone+'</span></div>';
    } else {
      const isRec=(Studio.busy===next.id);

const Landing={
  run:false, timer:null, phase:'idle', ready:false,
  reduced(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } },
  art(){
    const uniq=function(svg){ return svg.replace(/id="(cb|cg)"/g,'id="l$1"').replace(/url\(#(cb|cg)\)/g,'url(#l$1)'); };
    const a=document.getElementById('lp-calmi'), b=document.getElementById('lp-calmi2');
    if(a) a.innerHTML=uniq(calmiSVG('happy',200));
    if(b) b.innerHTML=uniq(calmiSVG('happy',140));
    if(a) a.setAttribute('aria-label',calmiName());
  },
  paintBreath(){
    const L=STR[state.lang], w=document.getElementById('br-word'), btn=document.getElementById('br-btn');
    if(w) w.textContent=this.phase==='in'?L.lpBrIn:this.phase==='out'?L.lpBrOut:L.lpBrReady;
    if(btn) btn.textContent=this.run?L.lpBrStop:L.lpBrStart;
  },
  setPhase(p){
    this.phase=p;
    const el=document.getElementById('lp-breath'); if(el) el.setAttribute('data-state',p);
    this.paintBreath();
  },
  cycle(){
    clearTimeout(this.timer);
    if(!this.run) return;
    if(document.body.getAttribute('data-auth')!=='out'){ this.stop(); return; }
    this.setPhase('in');
    const self=this;
    this.timer=setTimeout(function(){
      if(!self.run) return;
      self.setPhase('out');
      self.timer=setTimeout(function(){ self.cycle(); },6000);
    },4000);
  },
  start(){ this.run=true; this.cycle(); },
  stop(){ this.run=false; clearTimeout(this.timer); this.setPhase('idle'); },
  toTop(focus){
    const sc=document.getElementById('screen-landing');
    try{ sc.scrollTo({top:0,behavior:this.reduced()?'auto':'smooth'}); }catch(e){ sc.scrollTop=0; }
    if(focus){ setTimeout(function(){ const u=document.getElementById('auth-user'); if(u) u.focus({preventScroll:true}); },this.reduced()?0:450); }
  },
  init(){
    if(this.ready) return; this.ready=true;
    const self=this, root=document.getElementById('screen-landing'); if(!root) return;
    this.art(); this.paintBreath();
    // reveal on scroll (only elements below the first screen are hidden, and only if we can observe them)
    if('IntersectionObserver' in window && !this.reduced()){
      const io=new IntersectionObserver(function(es){
        es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
      },{root:root,threshold:.12,rootMargin:'0px 0px -6% 0px'});
      const sel='.lp-sec .lp-eyebrow,.lp-sec .lp-h2,.lp-sec .lp-p,.lp-steps li,.lp-card,.lp-mode,.lp-priv li,.lp-breath,.lp-final';
      root.querySelectorAll(sel).forEach(function(n,i){
        n.classList.add('rv'); n.style.transitionDelay=((i%3)*90)+'ms'; io.observe(n);
      });
    }
    root.addEventListener('click',function(ev){
      const t=ev.target.closest?ev.target.closest('button,a'):null; if(!t) return;
      if(t.id==='lp-start'||t.id==='lp-start2'){ Auth.setTab('up'); self.toTop(true); return; }
      if(t.id==='br-btn'){ if(self.run) self.stop(); else self.start(); return; }
      if(t.id==='lp-calmi'){
        const s=t.querySelector('svg'); if(!s) return;
        s.classList.add('poke'); setTimeout(function(){ s.classList.remove('poke'); },900); return;
      }
      if(t.dataset && t.dataset.lpScroll){
        const d=document.getElementById(t.dataset.lpScroll);
        if(d) d.scrollIntoView({behavior:self.reduced()?'auto':'smooth',block:'start'});
        if(t.dataset.lpScroll==='lp-try') setTimeout(function(){ if(!self.run) self.start(); },self.reduced()?0:700);
      }
    });
  }
};

/* ---- the native shell (Capacitor). On the web every call below is a quiet no-op. ---- */
const Native={
  is:false, P:{}, last:0, remId:7001,
  cfg(){ return window.SC_CONFIG||{}; },
  init(){
    const C=window.Capacitor, self=this;
    try{ this.is=!!(C && C.isNativePlatform && C.isNativePlatform()); }catch(e){ this.is=false; }
    if(!this.is) return;
    document.body.setAttribute('data-native',(C.getPlatform&&C.getPlatform())||'native');
    ['Haptics','LocalNotifications','Share','StatusBar','App'].forEach(function(n){
      try{ self.P[n]=C.registerPlugin(n); }catch(e){}
    });
    try{ if(this.P.StatusBar) this.P.StatusBar.setStyle({style:'LIGHT'}); }catch(e){}
    try{
      if(this.P.App) this.P.App.addListener('backButton',function(){ self.back(); });
    }catch(e){}
  },
  call(plugin,method,args){
    try{ const p=this.P[plugin]; if(p && p[method]) return Promise.resolve(p[method](args||{})).catch(function(){}); }catch(e){}
    return Promise.resolve();
  },
  tick(){ if(!this.is) return; const n=Date.now(); if(n-this.last<220) return; this.last=n; this.call('Haptics','impact',{style:'LIGHT'}); },
  success(){ if(this.is) this.call('Haptics','notification',{type:'SUCCESS'}); },
  canShare(){ return this.is || !!(navigator.share); },
  share(){
    const L=STR[state.lang], url=this.cfg().shareUrl||'';
    const data={title:'SystemCalm',text:L.shareText}; if(url) data.url=url;
    if(this.is) return this.call('Share','share',{title:data.title,text:data.text,url:url||undefined,dialogTitle:L.shareBtn});
    try{ return navigator.share(data).catch(function(){}); }catch(e){}
  },
  /* ---- daily reminder: local only, per account, rescheduled whenever the account or the language changes ---- */
  prefs(){ const p=(Store.mem&&Store.mem.prefs)||{}; return {on:!!p.reminderOn, time:p.reminderTime||'19:00'}; },
  async ensurePermission(ask){
    if(!this.is||!this.P.LocalNotifications) return false;
    try{
      let r=await this.P.LocalNotifications.checkPermissions();
      if(r.display==='granted') return true;
      if(!ask) return false;
      r=await this.P.LocalNotifications.requestPermissions();
      return r.display==='granted';
    }catch(e){ return false; }
  },
  async syncReminder(granted){
    if(!this.is||!this.P.LocalNotifications) return;
    const pf=this.prefs();
    try{ await this.P.LocalNotifications.cancel({notifications:[{id:this.remId}]}); }catch(e){}
    if(!pf.on || !Auth.cur) return;
    if(!granted && !(await this.ensurePermission(false))) return;
    const hm=String(pf.time).split(':'), L=STR[state.lang];
    try{
      await this.P.LocalNotifications.schedule({notifications:[{
        id:this.remId, title:L.remNotifTitle, body:L.remNotifBody,
        schedule:{on:{hour:parseInt(hm[0],10)||19,minute:parseInt(hm[1],10)||0},allowWhileIdle:true}
      }]});
    }catch(e){}
  },
  cancelReminder(){
    if(!this.is||!this.P.LocalNotifications) return;
    try{ this.P.LocalNotifications.cancel({notifications:[{id:this.remId}]}); }catch(e){}
  },
  /* the Android back button: close what is open, step back to the start, and only then leave */
  back(){
    try{
      if(Settings.isOpen()){ Settings.close(); return; }
      if(Rename.isOpen()){ Rename.close(); return; }
      const ov=document.getElementById('mf-overlay');
      if(ov && ov.classList.contains('open')){ document.getElementById('mf-burger').click(); return; }
      const out=document.body.getAttribute('data-auth')!=='in';
      const act=(el.screens.filter(function(s){ return s.classList.contains('is-active'); })[0]||{}).id;
      if(out || act==='screen-intake-1'){ if(this.P.App) this.P.App.exitApp(); return; }
      const home=document.querySelector('#main-nav [data-go="screen-intake-1"]');
      if(home) home.click(); else if(this.P.App) this.P.App.exitApp();
    }catch(e){ try{ this.P.App.exitApp(); }catch(x){} }
  }
};

    if(t.closest('#st-del-yes')){ Settings.wipe(); return; }
    // a small haptic tick on the main controls (native only)
    if(Native.is && t.closest('.btn-primary,.age-opt,.lp-tabs button,[data-chat],.tb,.nv,.mi')) Native.tick();
  });
  document.addEventListener('change',function(e){
    const t=e.target; if(!t) return;
    if(t.id==='st-rem-on') Settings.setReminder(t.checked);
    if(t.id==='st-rem-time') Settings.setTime(t.value);
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape' && Settings.isOpen()){ Settings.close(); e.stopPropagation(); }
  },true);
  Native.init();
})();

/* ==================================================================
   12b · WEB TEST SIGN-UP (only when config.js carries a signup server;
   never in the store apps). Sends username, age group, language and an
   optional email to the person running the test. Never the password,
   progress, chat or recordings.
   ================================================================== */
const V33_STR={
  en:{
    authEmail:'Email (optional)', authEmailH:'Only if you want us to reach you about the test. Children: a grown-up’s email.',
    regNote:'This is a test version. When you create an account, your username, age group and optional email are shared with the person running the test, so they can see who signed up. Your password stays on this device. Children should sign up with a grown-up.',
    regPriv:'This test version shares your username, age group, language and optional email with the person running the test. Your password, progress, chat and recordings stay on this device. Deleting your account sends a deletion notice so the record is removed.'
  },
  he:{
    authEmail:'אימייל (לא חובה)', authEmailH:'רק אם תרצו שניצור קשר בנוגע לבדיקה. ילדים: האימייל של מבוגר.',
    regNote:'זו גרסת בדיקה. בעת יצירת חשבון, שם המשתמש, קבוצת הגיל ואימייל (אם מילאתם) נשלחים למי שמנהל את הבדיקה, כדי שיראה מי נרשם. הסיסמה נשארת במכשיר הזה. ילדים מוזמנים להירשם יחד עם מבוגר.',
    regPriv:'בגרסת הבדיקה הזאת שם המשתמש, קבוצת הגיל, השפה והאימייל (אם מילאתם) נשלחים למי שמנהל את הבדיקה. הסיסמה, ההתקדמות, הצ׳אט וההקלטות נשארים במכשיר הזה. מחיקת החשבון שולחת הודעת מחיקה, והרישום יוסר.'
  }
};
Object.keys(V33_STR).forEach(function(l){ Object.keys(V33_STR[l]).forEach(function(k){ STR[l][k]=V33_STR[l][k]; }); });

const Registry={
  ok:false, busy:Promise.resolve(),
  cfg(){ return window.SC_CONFIG||{}; },
  init(){
    try{
      if(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) return;   // never in the store apps
      if(!this.cfg().signupUrl) return;
      this.ok=true; document.body.setAttribute('data-reg','1');
      try{ Auth.render(); Auth.showLanding(Auth.tab||'in'); }catch(e){}
      try{ if(Settings.isOpen()) Settings.paint(); }catch(e){}
      if(Auth.cur) this.touch();
    }catch(e){ this.ok=false; }
  },
  async post(event,a,extra){
    const ctl=new AbortController(), to=setTimeout(function(){ ctl.abort(); },12000);
    try{
      const body=Object.assign({_subject:'SystemCalm sign-up: '+event+' · '+a.shown, _template:'table', _captcha:'false', _honey:'',
        event:event, username:a.shown, id:a.regId||'', age:state.age||'', lang:state.lang||'', when:new Date().toISOString()}, extra||{});
      const r=await fetch(String(this.cfg().signupUrl),{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body)});
      if(!r.ok) throw new Error('http '+r.status);
      return true;
    } finally { clearTimeout(to); }
  },
  queue(fn){ const run=this.busy.then(fn,fn); this.busy=run.catch(function(){}); return run; },
  /* first time: announce the sign-up. After that: report the age group once it is chosen. Failures are silent and retried next time. */
  sync(a){
    if(!this.ok||!a||!a.reg) return;
    return this.queue(async()=>{
      try{
        if(!a.regSent){
          if(await this.post('signup',a,{email:a.regEmail||''})){ a.regSent=1; a.regAge=state.age||''; delete a.regEmail; Auth.save(); }
        } else if(state.age && a.regAge!==state.age){
          if(await this.post('age-group',a,{})){ a.regAge=state.age; Auth.save(); }
        }
      }catch(e){}
    });
  },
  record(a,email){ if(!this.ok||!a) return; a.reg=true; a.regId='r'+Math.random().toString(36).slice(2,10); a.regEmail=String(email||'').trim().slice(0,120); Auth.save(); return this.sync(a); },
  touch(){ return this.sync(Auth.cur); },
  remove(a){
    if(!this.ok||!a||!a.regSent) return;
    return this.queue(async()=>{ try{ await this.post('account-deleted',a,{}); }catch(e){} });
  },
  paintForm(){
    const w=document.getElementById('auth-email-wrap'); if(!w) return;
    const L=STR[state.lang];
    w.classList.toggle('is-gone',!(this.ok && Auth.tab==='up'));
    const l=document.getElementById('auth-email-l'); if(l) l.textContent=L.authEmail;
    const h=document.getElementById('auth-email-h'); if(h) h.textContent=L.authEmailH;
  }
};

(function(){
  const su=Auth.signUp;
  Auth.signUp=function(u,p,p2,keep){
    const eEl=document.getElementById('auth-email'), email=eEl?eEl.value:'';
    const r=su.call(this,u,p,p2,keep);
    if(!r && Registry.ok && this.cur){ Registry.record(this.cur,email); if(eEl) eEl.value=''; }
    return r;
  };
  const en=Auth.enter;
  Auth.enter=function(a,keep){ en.call(this,a,keep); try{ Registry.touch(); }catch(e){} };
  const dc=Auth.deleteCurrent;
  Auth.deleteCurrent=function(){ const a=this.cur; try{ Registry.remove(a); }catch(e){} dc.call(this); };
  const sl=Auth.showLanding;
  Auth.showLanding=function(tab){ sl.call(this,tab); try{ Registry.paintForm(); }catch(e){} };
  const rd=Auth.render;
  Auth.render=function(){ rd.call(this); try{
    const L=STR[state.lang], n=document.getElementById('auth-note');
    if(n && Registry.ok && this.tab==='up') n.textContent=L.regNote;
    Registry.paintForm();
  }catch(e){} };
  const sp=Settings.paint;
  Settings.paint=function(){ sp.call(this); try{
    if(Registry.ok && Auth.cur && Auth.cur.reg) document.getElementById('st-priv-p').textContent=STR[state.lang].regPriv;
  }catch(e){} };
  document.addEventListener('click',function(e){
    const t=e.target; if(t && t.closest && t.closest('#btn-step1')) setTimeout(function(){ try{ Registry.touch(); }catch(x){} },50);
  });
})();
try{ Registry.init(); }catch(e){}

applyLang((navigator.language||'en').toLowerCase().indexOf('he')===0?'he':'en');

})();
