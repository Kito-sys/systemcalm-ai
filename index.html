<style>
  /* ==================================================================
     MAINFRAME — the whole surface is black, the ink is white, and
     nothing is soft. No gradients, no coloured accents, no glow, no
     drop shadows: contrast and type carry the hierarchy on their own.
  ================================================================== */
  :root{
    --paper:#F6F4F1; --sage:#7E8C79;
    --font-heading:'HelveticaNowDisplay-Medium','Archivo','Helvetica Neue',Arial,sans-serif;
    --font-body:'HelveticaNowDisplayW01-Rg','Archivo','Helvetica Neue',Arial,sans-serif;
    --font-he:'Heebo','Archivo','Helvetica Neue',Arial,sans-serif;
    --ease-calm:cubic-bezier(.22,.61,.36,1);
    --ink:#17171A;
    --ink-2:rgba(23,23,26,.62);
    --ink-3:rgba(23,23,26,.40);
    --line:rgba(23,23,26,.18);
    --line-2:rgba(23,23,26,.10);
    --veil:rgba(246,244,241,.55);
  }
  html,body{height:100%}
  body{
    margin:0;background:#F6F4F1;color:var(--ink);
    font-family:var(--font-body);font-weight:400;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  html[lang="he"] body{font-family:var(--font-he)}
  h1,h2,h3,.font-heading{font-family:var(--font-heading);font-weight:500;letter-spacing:-.02em}
  html[lang="he"] h1,html[lang="he"] h2,html[lang="he"] h3{font-family:var(--font-he);font-weight:500}
  html[dir="rtl"] .dir-flip{transform:scaleX(-1)}
  ::selection{background:#17171A;color:#F6F4F1}

  /* ---------- background film ---------- */
  #bg-video{position:fixed;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;
    object-position:70% center;opacity:0;transition:opacity 900ms ease;pointer-events:none}
  body[data-film="on"] #bg-video{opacity:.16;filter:grayscale(1) contrast(.85)}
  #bg-scrim{position:fixed;inset:0;z-index:1;pointer-events:none;background:
    linear-gradient(180deg,rgba(246,244,241,.90) 0%,rgba(246,244,241,.74) 42%,rgba(246,244,241,.94) 100%)}
  body[data-film="off"] #bg-scrim{background:#F6F4F1}

  /* ---------- top bar ---------- */
  #app-header{position:fixed;top:0;left:0;right:0;z-index:30;
    display:flex;align-items:center;justify-content:space-between;gap:.75rem;
    padding:1rem 1.25rem;transition:opacity 1s ease}
  @media (min-width:640px){ #app-header{padding:1.25rem 2rem} }
  .mf-logo{display:flex;align-items:center;gap:.75rem;min-width:0}
  .mf-word{font-family:var(--font-heading);font-weight:500;letter-spacing:-.03em;
    font-size:21px;line-height:1;color:#17171A;white-space:nowrap}
  @media (min-width:640px){ .mf-word{font-size:26px} }
  .mf-star{font-size:25px;line-height:1;color:#17171A;user-select:none;letter-spacing:-.02em}
  @media (min-width:640px){ .mf-star{font-size:30px} }
  .mf-nav{display:none;align-items:center;gap:0;font-size:17px;color:#17171A}
  @media (min-width:768px){ .mf-nav{display:flex} }
  .mf-nav button,.mf-nav a{color:#17171A;transition:opacity .2s ease;background:none;border:0;
    font:inherit;cursor:pointer;padding:0}
  .mf-nav button:hover,.mf-nav a:hover{opacity:.6}
  .mf-lang{display:flex;align-items:center;font-size:17px;color:#17171A}
  .mf-lang button{color:#17171A;background:none;border:0;font:inherit;cursor:pointer;padding:0;
    transition:opacity .2s ease;text-decoration:none;opacity:.55}
  .mf-lang button:hover{opacity:1}
  .mf-lang button[aria-pressed="true"]{opacity:1;text-decoration:underline;text-underline-offset:3px}
  .mf-cta{display:none;font-size:17px;color:#17171A;text-decoration:underline;text-underline-offset:2px;
    background:none;border:0;font:inherit;cursor:pointer;transition:opacity .2s ease}
  .mf-cta:hover{opacity:.6}
  @media (min-width:768px){ .mf-cta{display:inline-block} }
  .mf-burger{display:grid;gap:5px;background:none;border:0;padding:.25rem;cursor:pointer}
  @media (min-width:768px){ .mf-burger{display:none} }
  .mf-burger span{display:block;width:24px;height:2px;background:#17171A;transition:transform .3s ease,opacity .3s ease}
  .mf-burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .mf-burger.open span:nth-child(2){opacity:0}
  .mf-burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  #mf-overlay{position:fixed;inset:0;z-index:29;background:rgba(246,244,241,.96);backdrop-filter:blur(14px);
    display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
    gap:2rem;padding:0 2rem;opacity:0;pointer-events:none;transition:opacity .3s ease}
  #mf-overlay.open{opacity:1;pointer-events:auto}
  @media (min-width:768px){ #mf-overlay{display:none} }
  #mf-overlay button{font-size:32px;font-weight:500;color:#17171A;background:none;border:0;
    font-family:inherit;cursor:pointer;text-align:start;padding:0}
  #mf-overlay button.u{text-decoration:underline;text-underline-offset:3px}

  /* ---------- shell ---------- */
  .shell{max-width:46rem;padding-top:calc(env(safe-area-inset-top) + 4.4rem)}
  /* a small or short screen cannot spare 70px of chrome */
  @media (max-width:360px),(max-height:620px){
    .shell{padding-top:calc(env(safe-area-inset-top) + 3.3rem)}
    #app-header{padding:.6rem 1rem}
    .mf-word{font-size:17px} .mf-star{font-size:20px}
    .mf-lang,.mf-nav{font-size:14px}
  }
  
  @media (min-width:1024px){ body[data-view="session"] .shell{max-width:64rem} }
  @media (min-width:1024px){ body[data-view="parent"] .shell{max-width:62rem} }

  /* ---------- screens ---------- */
  .screen{
    position:absolute;inset:0;display:flex;flex-direction:column;
    justify-content:center;justify-content:safe center;
    overflow-y:auto;overflow-x:hidden;padding-block:.5rem;
    opacity:0;visibility:hidden;transform:translateY(8px);
    transition:opacity 520ms var(--ease-calm),transform 520ms var(--ease-calm),visibility 0s linear 520ms;
    pointer-events:none;
  }
  .screen > *{flex:none;width:100%}
  .screen:focus{outline:none}
  .screen.is-active{opacity:1;visibility:visible;transform:none;
    transition:opacity 520ms var(--ease-calm),transform 520ms var(--ease-calm),visibility 0s linear 0s;pointer-events:auto}
  .screen.is-active .stagger > *{animation:riseIn 620ms var(--ease-calm) both}
  .screen.is-active .stagger > *:nth-child(2){animation-delay:70ms}
  .screen.is-active .stagger > *:nth-child(3){animation-delay:140ms}
  .screen.is-active .stagger > *:nth-child(4){animation-delay:210ms}
  .screen.is-active .stagger > *:nth-child(5){animation-delay:280ms}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .fade-slow{animation:fadeSlow 800ms ease both}
  @keyframes fadeSlow{from{opacity:0}to{opacity:1}}
  .lift{z-index:10}
  /* selected buttons invert; their inner text must follow, not stay dark */
  .opacity-60{opacity:.6}
  .opacity-70{opacity:.7}
  .is-gone{display:none !important}

  /* ---------- the blurred label, straight from the design code ---------- */
  .mf-blur{pointer-events:none;user-select:none;filter:blur(3px);opacity:.75;
    font-size:clamp(18px,4vw,26px);line-height:1.3;font-weight:400;color:#17171A}
  /* ---------- typewriter ---------- */
  .mf-type{font-size:clamp(18px,4vw,26px);line-height:1.35;font-weight:400;color:#17171A;min-height:54px}
  .mf-caret{display:inline-block;width:2px;height:1.1em;background:#17171A;vertical-align:middle;
    margin-inline-start:2px;animation:blinkCaret 1s step-end infinite}
  @keyframes blinkCaret{0%,100%{opacity:1}50%{opacity:0}}
  .mf-pills{display:flex;flex-wrap:wrap;row-gap:.25rem;opacity:0;transform:translateY(8px);
    transition:opacity .4s ease,transform .4s ease}
  .mf-pills.in{opacity:1;transform:none}

  /* ---------- panels: hairline, square, flat ---------- */
  .card,.tile{background:rgba(23,23,26,.035);border:1px solid var(--line-2);
    border-radius:4px;box-shadow:none;backdrop-filter:blur(6px)}
  .card{padding:1.25rem}
  .tile{padding:1rem 1.1rem}
  .tile-num{font-family:var(--font-heading);font-size:2rem;line-height:1;font-weight:500;
    color:#17171A;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .tile-lbl{font-size:.74rem;font-weight:400;color:var(--ink-2);margin-top:.4rem}
  .tile-sub{font-size:.7rem;color:var(--ink-3);margin-top:.15rem}

  /* ---------- choices ---------- */
  .opt{position:relative;display:flex;align-items:center;gap:1rem;width:100%;
    padding:1.05rem 1.15rem;text-align:start;border-radius:4px;
    background:rgba(23,23,26,.04);border:1px solid var(--line);color:#17171A;
    transition:background .2s ease,border-color .2s ease,transform .2s var(--ease-calm)}
  @media (hover:hover){ .opt:hover{background:rgba(23,23,26,.10);border-color:rgba(23,23,26,.45)} }
  .opt:active{transform:scale(.99)}
  .opt:focus-visible{outline:2px solid #17171A;outline-offset:2px}
  .opt.is-selected{background:#17171A;color:#F6F4F1;border-color:#17171A}
  .opt.is-selected .opt-arrow{opacity:1;color:#F6F4F1}
  .opt-ico{display:grid;place-items:center;width:2.8rem;height:2.8rem;flex:none;border-radius:999px;
    border:1px solid currentColor;opacity:.9}
  .opt.is-selected .opt-ico{border-color:#F6F4F1}
  .opt-arrow{margin-inline-start:auto;opacity:.4;transition:opacity .2s;color:currentColor}

  /* ---------- pills ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:999px;
    font-family:inherit;font-size:.95rem;font-weight:400;padding:.72rem 1.5rem;white-space:nowrap;
    transition:background-color .2s ease,color .2s ease,border-color .2s ease,opacity .2s ease;
    border:1px solid transparent;cursor:pointer}
  .btn-primary{background:#17171A;color:#F6F4F1;border-color:#17171A}
  .btn-primary:hover{background:#F6F4F1;color:#17171A;border-color:#17171A}
  .btn-primary:disabled{cursor:not-allowed;background:transparent;color:rgba(23,23,26,.34);
    border-color:rgba(23,23,26,.16);opacity:1}
  .btn-ghost{background:transparent;color:#17171A;border-color:var(--line)}
  .btn-ghost:hover{background:#17171A;color:#F6F4F1;border-color:#17171A}
  .btn:focus-visible{outline:2px solid #17171A;outline-offset:3px}
  .btn-sm{padding:.5rem 1.1rem;font-size:.85rem}
  .mf-pill{display:inline-flex;align-items:center;justify-content:center;background:#17171A;color:#F6F4F1;
    border:1px solid rgba(246,244,241,.1);border-radius:999px;font-size:13px;padding:.3em 1rem;
    margin-inline:.2em;margin-bottom:.4em;white-space:nowrap;cursor:pointer;font-family:inherit;
    transition:background-color .2s ease,color .2s ease}
  @media (min-width:640px){ .mf-pill{font-size:15px;padding:.3em 1.25rem} }
  .mf-pill:hover{background:#F6F4F1;color:#17171A}
  .mf-pill-out{background:transparent;color:#17171A;border-color:#17171A;gap:.5rem}
  .mf-pill-out:hover{background:#17171A;color:#F6F4F1}

  /* ---------- input ---------- */
  .field{width:100%;border-radius:4px;background:transparent;border:1px solid var(--line);
    padding:.95rem 1.05rem;font-size:1rem;font-family:inherit;color:#17171A;
    transition:border-color .2s ease}
  .field::placeholder{color:var(--ink-3)}
  .field:focus{outline:none;border-color:#17171A}

  .eyebrow{font-size:11px;font-weight:400;line-height:1.3;text-transform:uppercase;
    letter-spacing:.18em;color:var(--ink-2)}
  html[lang="he"] .eyebrow{text-transform:none;letter-spacing:.02em;font-size:12px}

  .rail{height:1px;background:var(--line-2);overflow:hidden}
  .rail-fill{height:100%;background:var(--sage);transition:width 560ms var(--ease-calm)}

  /* ---------- the character, in black and white ---------- */
  .buddy{display:block;overflow:visible;animation:bob 5.5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .buddy-eyes{animation:blink 6.5s infinite;transform-box:fill-box;transform-origin:center}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.06)}}
  .buddy-antenna{animation:sway 6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
  @keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  .buddy-glow{display:none}
  .buddy-arm-l{animation:waveArm 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:90% 20%}
  @keyframes waveArm{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-10deg)}}
  .buddy[data-mood="sleepy"] .buddy-eyes{display:none}
  .buddy[data-mood="sleepy"] .eye-closed{display:block}
  .buddy[data-mood="sleepy"]{animation-duration:8s}
  .eye-closed{display:none}
  .bubble{position:relative}

  /* ---------- session stage ---------- */
  .stage{position:relative;width:min(74vw,290px);height:min(74vw,290px);display:grid;place-items:center}
  @media (max-height:720px){ .stage{width:min(40vh,290px);height:min(40vh,290px)} }
  @media (min-width:768px){ .stage{width:min(50vh,350px);height:min(50vh,350px)} }
  @media (min-width:1024px){ .stage{width:min(56vh,400px);height:min(56vh,400px)} }
  body[data-mode="child"] .stage{width:100%;height:auto;min-height:0;display:block}

  .orb-halo,.orb-ring,.orb-core{position:absolute;border-radius:999px;
    transition:transform var(--ph,3s) var(--ease-calm),opacity var(--ph,3s) var(--ease-calm)}
  .orb-halo{inset:-6%;border:1px solid rgba(23,23,26,.08)}
  .orb-ring{inset:5%;border:1px solid rgba(126,140,121,.55)}
  .orb-core{inset:20%;background:var(--sage);opacity:.88}
  .orb-guide{position:absolute;inset:0;border-radius:999px;border:1px dashed rgba(23,23,26,.12)}

  .pad{position:absolute;top:50%;width:34%;aspect-ratio:1;border-radius:999px;
    transform:translateY(-50%) scale(.9);border:1px solid var(--line);opacity:.5;
    transition:opacity .25s ease,transform .25s var(--ease-calm),background-color .25s ease}
  .pad.on{opacity:1;transform:translateY(-50%) scale(1.06);background:var(--sage)}
  .pad-l{inset-inline-start:2%} .pad-r{inset-inline-end:2%}

  .press-box{width:76%;height:76%;border-radius:4px;display:grid;place-items:center;
    border:1px solid rgba(23,23,26,.35);
    transition:transform var(--ph,3s) var(--ease-calm),background-color var(--ph,3s) ease}
  .quiet-ring{width:62%;height:62%;border-radius:999px;border:1px solid rgba(23,23,26,.30);
    animation:quietBreathe 7s ease-in-out infinite}
  @keyframes quietBreathe{0%,100%{transform:scale(.94);opacity:.45}50%{transform:scale(1.03);opacity:.9}}

  .trace-svg{width:100%;height:100%;overflow:visible}
  .trace-guide{fill:none;stroke:rgba(23,23,26,.16);stroke-width:1.5;stroke-linecap:round}
  .trace-live{fill:none;stroke:var(--sage);stroke-width:2;stroke-linecap:round}
  .trace-dot{fill:var(--sage)}
  .trace-halo{fill:rgba(23,23,26,.18)}

  .step-text{font-size:clamp(1.15rem,5.5vw,1.6rem);font-weight:400;line-height:1.45;color:#17171A}

  .ring-wrap{position:absolute;inset:-6%;pointer-events:none}
  .ring-bg{fill:none;stroke:rgba(23,23,26,.10);stroke-width:1}
  .ring-fg{fill:none;stroke:var(--sage);stroke-width:1.5;stroke-linecap:round;
    transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .3s linear}
  html[dir="rtl"] .ring-fg{transform:rotate(-90deg) scaleX(-1)}

  .calm-veil{position:fixed;inset:0;z-index:5;pointer-events:none;background:#F6F4F1;
    opacity:0;transition:opacity 1.4s ease}
  .calm-veil.on{opacity:.88}

  .ctrlbar{display:flex;align-items:center;justify-content:center;gap:.5rem;flex-wrap:wrap}
  .ctrl{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:999px;
    background:transparent;border:1px solid var(--line);color:#17171A;cursor:pointer;
    transition:background-color .2s ease,color .2s ease,border-color .2s ease}
  .ctrl:hover{background:var(--sage);color:var(--paper);border-color:var(--sage)}
  .ctrl.on{background:var(--sage);color:var(--paper);border-color:var(--sage)}
  .ctrl:focus-visible{outline:2px solid #17171A;outline-offset:3px}

  .seal{animation:sealIn 800ms var(--ease-calm) both}
  @keyframes sealIn{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
  .seal-ring{animation:sealRing 2.6s ease-out infinite}
  @keyframes sealRing{0%{transform:scale(.9);opacity:.4}100%{transform:scale(1.5);opacity:0}}

  /* ---------- child mode: bigger targets, same language ---------- */
  body[data-mode="child"] .opt{padding:1.3rem 1.25rem;gap:1.1rem}
  body[data-mode="child"] .opt-ico{width:3.4rem;height:3.4rem}
  body[data-mode="child"] .opt-ico svg{width:1.9rem;height:1.9rem}
  body[data-mode="child"] .btn{padding:.95rem 2rem;font-size:1.02rem}
  body[data-mode="child"] .ctrl{width:3.2rem;height:3.2rem}
  body[data-mode="child"] .ctrl svg{width:1.5rem;height:1.5rem}
  body[data-mode="child"] #phase-wrap{display:none}
  body[data-mode="child"] .field{padding:1.05rem 1.2rem;font-size:1.1rem;text-align:center}
  body[data-mode="child"] [data-i18n="welcomeSub"],
  body[data-mode="child"] #name-label,
  body[data-mode="child"] [data-i18n="privacy"],
  body[data-mode="child"] [data-i18n="overloadHelp"],
  body[data-mode="child"] [data-i18n="stableHelp"]{display:none}
  body[data-mode="child"] #s1-title,
  body[data-mode="child"] h1{font-size:1.6rem;line-height:1.2}
  body[data-mode="child"] #q-overload,
  body[data-mode="child"] #q-stable{font-size:1.45rem}

  .calmi-stage{display:flex;flex-direction:column;align-items:center;gap:.5rem;width:100%}
  .calmi-bubble{max-width:34rem;width:100%;padding:1rem 1.15rem;border-radius:4px;
    background:rgba(23,23,26,.05);border:1px solid var(--line-2);text-align:center}
  .calmi-line{font-size:clamp(1.05rem,4.6vw,1.35rem);font-weight:400;line-height:1.45;color:#17171A;min-height:1.5em}
  .calmi-caret{display:inline-block;width:.5ch;opacity:.6;animation:caret .8s steps(1) infinite}
  @keyframes caret{0%,50%{opacity:.6}51%,100%{opacity:0}}
  .calmi-holder{transition:transform 4s cubic-bezier(.37,0,.63,1);will-change:transform;transform-origin:50% 92%}
  .calmi-mini{opacity:.95}
  .m-open{opacity:0}
  .calmi.talking .m-smile{opacity:0}
  .calmi.talking .m-open{opacity:1;animation:talkMouth .26s ease-in-out infinite alternate;
    transform-box:fill-box;transform-origin:center}
  @keyframes talkMouth{from{transform:scaleY(.42) scaleX(.94)}to{transform:scaleY(1.1) scaleX(1.04)}}
  .calmi .arm-l,.calmi .arm-r{transition:transform .18s var(--ease-calm);transform-box:fill-box;transform-origin:top center}
  .calmi.tap-l .arm-l{transform:translate(48px,-6px) rotate(-38deg)}
  .calmi.tap-r .arm-r{transform:translate(-48px,-6px) rotate(38deg)}
  .calmi-holder.squash{transform:scale(1.1,.86)!important}
  .calmi.cheer{animation:cheer 1.2s ease-in-out infinite}
  @keyframes cheer{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}

  .stars{display:flex;justify-content:center;gap:.5rem}
  .star{width:1.75rem;height:1.75rem;color:rgba(23,23,26,.22);
    transition:color .5s ease,transform .5s var(--ease-calm)}
  .star.lit{color:var(--sage);transform:scale(1.1)}

  .session-grid{display:flex;flex-direction:column;align-items:center;gap:1.25rem;width:100%}
  .s-right{display:flex;flex-direction:column;align-items:center;gap:1.15rem;width:100%}
  @media (min-width:640px) and (max-height:560px){
    .session-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:1.5rem;align-items:center;justify-items:center}
    .s-left{grid-column:1;justify-self:center}
    .s-right{grid-column:2;gap:.7rem;max-width:24rem}
    body[data-mode="child"] .session-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-width:none}
    body[data-mode="child"] .s-left{grid-column:1}
    body[data-mode="child"] .s-right{grid-column:2}
    .stage{width:min(58vh,240px);height:min(58vh,240px)}
    body[data-mode="child"] .stage{width:100%;height:auto}
    .calmi-holder svg{width:min(46vh,190px);height:auto}
    .calmi-line{font-size:clamp(.95rem,3.2vh,1.15rem)}
  }
  @media (min-width:1000px) and (min-height:620px){
    .session-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
      gap:3rem;align-items:center;justify-items:center}
    .s-left{grid-column:1;justify-self:center}
    .s-right{grid-column:2;display:flex;flex-direction:column;gap:1.25rem;width:100%;max-width:26rem}
    body[data-mode="child"] .session-grid{grid-template-columns:1fr;max-width:44rem;margin:0 auto}
    body[data-mode="child"] .s-left,body[data-mode="child"] .s-right{grid-column:1;max-width:none}
  }

  /* ---------- data ---------- */
  .bar-row{display:grid;grid-template-columns:minmax(5.5rem,38%) 1fr auto;align-items:center;gap:.6rem;padding:.3rem 0}
  .bar-name{font-size:.8rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{display:block;height:6px;background:rgba(23,23,26,.08);overflow:hidden}
  .bar-fill{display:block;height:100%;background:var(--sage);transition:width .8s var(--ease-calm)}
  .bar-val{font-size:.72rem;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:2.6rem;text-align:end}
  .col-chart{display:flex;align-items:flex-end;justify-content:space-between;gap:.5rem;height:88px}
  .col{display:flex;flex-direction:column;align-items:center;gap:.35rem;flex:1;min-width:0}
  .col-bar{display:block;width:100%;max-width:2.4rem;background:rgba(126,140,121,.75);transition:height .8s var(--ease-calm)}
  .col-lbl{font-size:.62rem;color:var(--ink-3);white-space:nowrap}
  .col-val{font-size:.66rem;color:var(--ink-2);font-variant-numeric:tabular-nums}

  .badge-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
  .badge-grid.center{justify-content:center}
  @media (min-width:640px){ .badge-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
  .badge{display:flex;flex-direction:column;align-items:center;gap:.45rem;padding:.9rem .6rem;
    border-radius:4px;border:1px solid var(--line-2);background:rgba(23,23,26,.03);
    text-align:center;opacity:.4;transition:opacity .3s ease,border-color .3s ease,background-color .3s ease}
  .badge.earned{opacity:1;border-color:var(--line);background:rgba(23,23,26,.08)}
  .badge.fresh{border-color:#17171A}
  .badge-ico{display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:999px;
    border:1px solid currentColor;color:#17171A}
  .badge-name{font-size:.68rem;font-weight:400;color:var(--ink-2);line-height:1.25}
  .badge.earned .badge-name{color:#17171A}

  .win-pop{position:fixed;inset-inline:0;bottom:1.25rem;z-index:40;display:flex;justify-content:center;
    padding:0 1rem;pointer-events:none}
  .win-card{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;border-radius:999px;
    background:#17171A;color:#F6F4F1;border:1px solid #17171A;max-width:28rem}
  .win-card p{color:#F6F4F1}
  .win-card .badge-ico{border-color:#F6F4F1;color:#F6F4F1;background:transparent}

  /* ---------- native controls, brought onto the black ---------- */
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(23,23,26,.25)}
  input[type=range]::-moz-range-track{height:1px;background:rgba(23,23,26,.25)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;
    border-radius:999px;background:#17171A;border:0;margin-top:-5.5px}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:999px;background:#17171A;border:0}
  input[type=range]:focus-visible{outline:2px solid #17171A;outline-offset:4px}
  select{-webkit-appearance:none;appearance:none;color:#17171A;background:transparent;font-family:inherit;
    border-radius:4px;background-image:linear-gradient(45deg,transparent 50%,#17171A 50%),linear-gradient(135deg,#17171A 50%,transparent 50%);
    background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  html[dir="rtl"] select{background-position:13px 52%,18px 52%}
  select option{background:#F6F4F1;color:#17171A}
  ::-webkit-scrollbar{width:8px;height:8px}

/* =====================================================================
   REDESIGN LAYER — driven entirely by tokens on html[data-theme]
===================================================================== */
html[data-theme]{ --sage:var(--accent); --paper:var(--accent-ink); }
html[data-theme] body{background:var(--bg);color:var(--ink);font-feature-settings:"ss01","cv11"}
html[data-theme] ::selection{background:var(--accent);color:var(--accent-ink)}
html[data-theme] *:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:3px}

/* film + scrim */
html[data-theme] body[data-film="on"] #bg-video{opacity:var(--film,.12);filter:grayscale(.6) contrast(.9)}
html[data-theme] #bg-scrim{background:linear-gradient(180deg,rgb(var(--bg-rgb)/.90) 0%,rgb(var(--bg-rgb)/.72) 45%,rgb(var(--bg-rgb)/.94) 100%)}
html[data-theme] body[data-film="off"] #bg-scrim{background:var(--bg)}
html[data-theme] .calm-veil{background:var(--bg)}

/* header */
html[data-theme] .mf-word,html[data-theme] .mf-star,html[data-theme] .mf-nav,
html[data-theme] .mf-nav button,html[data-theme] .mf-lang,html[data-theme] .mf-lang button,
html[data-theme] .mf-cta{color:var(--ink)}
html[data-theme] .mf-burger span{background:var(--ink)}
html[data-theme] #mf-overlay{background:rgb(var(--bg-rgb)/.97)}
html[data-theme] #mf-overlay button{color:var(--ink)}

/* tailwind colour utilities -> tokens */
html[data-theme] .text-\[\#17171A\]{color:var(--ink)}
html[data-theme] .text-\[\#17171A\]\/45{color:var(--ink-3)}
html[data-theme] .text-\[\#17171A\]\/60,html[data-theme] .text-\[\#17171A\]\/70{color:var(--ink-2)}
html[data-theme] .text-\[\#F6F4F1\]{color:var(--accent-ink)}
html[data-theme] .hover\:text-\[\#17171A\]:hover{color:var(--ink)}
html[data-theme] .bg-\[\#17171A\]{background-color:var(--accent)}
html[data-theme] .bg-\[\#17171A\]\/\[0\.05\]{background-color:var(--surface-2)}
html[data-theme] .border-\[\#17171A\]\/15,html[data-theme] .border-\[\#17171A\]\/20,
html[data-theme] .border-\[\#17171A\]\/30{border-color:var(--line)}
html[data-theme] .border-\[\#17171A\],html[data-theme] .hover\:border-\[\#17171A\]:hover{border-color:var(--ink-2)}
html[data-theme] .ring-\[\#17171A\]\/15{--tw-ring-color:var(--line)}
html[data-theme] .text-slate-400,html[data-theme] .text-slate-500{color:var(--ink-3)}
html[data-theme] .text-slate-600,html[data-theme] .text-slate-700{color:var(--ink-2)}
html[data-theme] .text-slate-800,html[data-theme] .text-slate-900{color:var(--ink)}

/* type */
html[data-theme] h1,html[data-theme] h2,html[data-theme] h3{color:var(--ink)}
html[data-theme] .eyebrow{color:var(--ink-2)}
html[data-theme] .mf-blur{filter:none;opacity:1;font-size:.8rem;letter-spacing:.01em;color:var(--ink-2);line-height:1.5;max-width:30rem}
html[data-theme] .mf-caret{background:var(--accent)}
html[data-theme] .step-text{color:var(--ink)}
html[data-theme] .tile-num{color:var(--ink)}

/* surfaces */
html[data-theme] .card,html[data-theme] .tile{background:var(--surface);border:1px solid var(--line-2);
  border-radius:var(--r-card);box-shadow:var(--shadow);backdrop-filter:none}
html[data-theme] .calmi-bubble{background:var(--surface);border:1px solid var(--line-2);
  border-radius:var(--r-card);box-shadow:var(--shadow)}
html[data-theme] .calmi-line{color:var(--ink)}
html[data-theme] .rail{height:var(--rail-h,3px);background:var(--line-2);border-radius:99px}
html[data-theme] .rail-fill{background:var(--accent);border-radius:99px}

/* choices */
html[data-theme] .opt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-opt);color:var(--ink);box-shadow:var(--shadow-sm)}
@media (hover:hover){ html[data-theme] .opt:hover{background:var(--surface-2);border-color:var(--line-hi)} }
html[data-theme] .opt.is-selected{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
html[data-theme] .opt.is-selected [class*="text-"]{color:inherit}
html[data-theme] .opt.is-selected .opt-arrow{color:var(--accent-ink)}
html[data-theme] .opt.is-selected .opt-ico{border-color:var(--accent-ink);background:transparent}
html[data-theme] .opt-ico{border:0;background:var(--accent-soft);color:var(--accent-deep);opacity:1}

/* buttons */
html[data-theme] .btn{border-radius:var(--r-btn);font-weight:500;padding:.9rem 1.7rem;font-size:1rem}
html[data-theme] .btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
html[data-theme] .btn-primary:hover{background:var(--accent-hover);color:var(--accent-ink);border-color:var(--accent-hover)}
html[data-theme] .btn-primary:disabled{background:var(--surface-2);color:var(--ink-3);border-color:transparent}
html[data-theme] .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-hi)}
html[data-theme] .btn-ghost:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line-hi)}
html[data-theme] .mf-pill{background:var(--accent);color:var(--accent-ink);border-color:transparent}
html[data-theme] .mf-pill-out{background:transparent;color:var(--ink);border-color:var(--line-hi)}
html[data-theme] .field{background:var(--surface);border:1px solid var(--line-hi);border-radius:var(--r-opt);color:var(--ink)}
html[data-theme] .field::placeholder{color:var(--ink-3)}
html[data-theme] .field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* session controls: pause + stop lead, the rest recede */
html[data-theme] .ctrlbar{gap:.7rem 1rem}
html[data-theme] .ctrlbar::before{content:"";order:2;flex-basis:100%;height:0}
html[data-theme] #btn-pause{order:0;width:4.6rem;height:4.6rem;background:var(--accent);color:var(--accent-ink);
  border:0;box-shadow:var(--shadow-btn)}
html[data-theme] #btn-pause:hover{background:var(--accent-hover)}
html[data-theme] #btn-pause svg{width:1.8rem;height:1.8rem}
html[data-theme] .ctrlbar [data-action="stop"]{order:1;padding:1.05rem 1.7rem;font-size:1rem}
html[data-theme] #btn-sound,html[data-theme] #btn-voice,html[data-theme] #btn-info{order:3;
  width:2.6rem;height:2.6rem;border-color:transparent;background:var(--surface-2);color:var(--ink-2)}
html[data-theme] #btn-sound svg,html[data-theme] #btn-voice svg,html[data-theme] #btn-info svg{width:1.15rem;height:1.15rem}
html[data-theme] .ctrl:hover{background:var(--accent-soft);color:var(--ink);border-color:transparent}
html[data-theme] .ctrl.on{background:var(--accent-soft);color:var(--accent-deep);border-color:var(--accent)}
html[data-theme] body[data-mode="child"] #btn-pause{width:5rem;height:5rem}
html[data-theme] body[data-mode="child"] #btn-sound,html[data-theme] body[data-mode="child"] #btn-voice,
html[data-theme] body[data-mode="child"] #btn-info{width:2.8rem;height:2.8rem}

/* stage */
html[data-theme] .orb-halo{border-color:var(--line-2)}
html[data-theme] .orb-ring{border-color:var(--ring)}
html[data-theme] .orb-core{background:var(--accent);box-shadow:var(--orb-glow);opacity:.95}
html[data-theme] .orb-guide{border-color:var(--line-2)}
html[data-theme] .pad{border-color:var(--line-hi);background:var(--surface)}
html[data-theme] .pad.on{background:var(--accent);border-color:var(--accent)}
html[data-theme] .press-box{border-color:var(--line-hi);border-radius:var(--r-card);background:var(--surface)}
html[data-theme] .quiet-ring{border-color:var(--ring)}
html[data-theme] .trace-guide{stroke:var(--line-hi)}
html[data-theme] .trace-halo{fill:var(--line)}
html[data-theme] .ring-bg{stroke:var(--line-2)}
html[data-theme] .ring-fg{stroke:var(--accent);stroke-width:2.5}
html[data-theme] .star{color:var(--line-hi)}
html[data-theme] .star.lit{color:var(--star)}

/* data + badges */
html[data-theme] .bar-track{background:var(--surface-2);border-radius:99px}
html[data-theme] .bar-fill{background:var(--accent);border-radius:99px}
html[data-theme] .col-bar{background:var(--accent);opacity:.8;border-radius:6px 6px 2px 2px}

/* ===== Calmi · alive but unhurried ===== */
.calmi .buddy-body{transform-box:fill-box;transform-origin:50% 100%;animation:cmBreathe 5.6s ease-in-out infinite}
@keyframes cmBreathe{0%,100%{scale:1 1}50%{scale:1.013 1.024}}
.calmi.buddy{animation:cmFloat 6.4s ease-in-out infinite}
@keyframes cmFloat{0%,100%{transform:translateY(0) rotate(-.7deg)}50%{transform:translateY(-6px) rotate(.7deg)}}
body[data-view="session"] .calmi.buddy{animation-name:cmFloatSoft}
@keyframes cmFloatSoft{0%,100%{transform:translateY(0) rotate(-.3deg)}50%{transform:translateY(-3px) rotate(.3deg)}}
.calmi.buddy.cheer{animation:cheer 1.2s ease-in-out infinite}
.calmi .buddy-shadow{transform-box:fill-box;transform-origin:center;animation:cmShadow 6.4s ease-in-out infinite}
@keyframes cmShadow{0%,100%{scale:1 1;opacity:.14}50%{scale:.84 .9;opacity:.08}}
/* arms trail the body a little: secondary motion */
.calmi .arm-l{animation:cmArmL 6.8s ease-in-out infinite}
.calmi .arm-r{animation:cmArmR 6.8s ease-in-out -2.1s infinite}
@keyframes cmArmL{0%,100%{rotate:3deg}50%{rotate:-5deg}}
@keyframes cmArmR{0%,100%{rotate:-3deg}50%{rotate:5deg}}
.calmi .buddy-antenna{animation:sway 7s ease-in-out infinite}
.calmi .antenna-glow{transform-box:fill-box;transform-origin:center;animation:cmGlow 4.8s ease-in-out infinite}
@keyframes cmGlow{0%,100%{opacity:0;scale:.7}50%{opacity:.7;scale:1.15}}
/* natural blinks: a pause, a blink, now and then a quick double */
.calmi .buddy-eyes{transform-box:fill-box;transform-origin:center;animation:cmBlink 7.4s infinite}
@keyframes cmBlink{0%,86%,100%{transform:scaleY(1)}88%{transform:scaleY(.07)}90.5%{transform:scaleY(1)}93%{transform:scaleY(.07)}95.5%{transform:scaleY(1)}}
.calmi .buddy-gaze{animation:cmGaze 14s ease-in-out infinite}
@keyframes cmGaze{0%,100%{translate:0 0}10%{translate:2.4px .4px}28%{translate:-2.6px 1px}46%{translate:0 -1.4px}64%{translate:2.2px 1px}82%{translate:-1.2px 0}}
.calmi .buddy-cheek{animation:cmCheek 5.2s ease-in-out infinite}
@keyframes cmCheek{0%,100%{opacity:.28}50%{opacity:.46}}
/* speaking: uneven syllables instead of a metronome, and eyes on you */
.calmi .m-smile{transition:opacity .12s ease}
.calmi.talking .m-open{animation:cmTalk .78s linear infinite}
@keyframes cmTalk{0%{transform:scaleY(.35) scaleX(.95)}13%{transform:scaleY(1.05) scaleX(1.03)}28%{transform:scaleY(.5) scaleX(.97)}43%{transform:scaleY(.88) scaleX(1)}57%{transform:scaleY(.3) scaleX(.94)}73%{transform:scaleY(1.12) scaleX(1.05)}88%{transform:scaleY(.55) scaleX(.98)}100%{transform:scaleY(.35) scaleX(.95)}}
.calmi.talking .buddy-gaze{animation-play-state:paused;translate:0 0}
.calmi.talking .buddy-cheek{opacity:.5;animation:none}
/* a poke: giggle */
.calmi.poke .buddy-eyes{display:none}
.calmi.poke .eye-closed{display:block}
.calmi.poke .buddy-body{animation:cmGiggle .8s ease-in-out}
@keyframes cmGiggle{0%{rotate:0deg;scale:1 1}18%{rotate:-4deg;scale:1.03 .96}42%{rotate:4deg;scale:.98 1.03}66%{rotate:-2deg;scale:1.01 .99}100%{rotate:0deg;scale:1 1}}
.calmi-bubble{animation:cmBubble .55s var(--ease-calm) both}
@keyframes cmBubble{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.calmi{cursor:pointer}
@media (prefers-reduced-motion:reduce){
  .calmi .buddy-body,.calmi.buddy,.calmi .buddy-shadow,.calmi .arm-l,.calmi .arm-r,.calmi .buddy-antenna,
  .calmi .antenna-glow,.calmi .buddy-gaze,.calmi .buddy-cheek,.calmi-bubble,.calmi.poke .buddy-body{animation:none!important}
  .calmi .buddy-eyes{animation:none!important}
}

  html[data-theme] #hero-blur{display:none!important}

}

}

/* sections */
.lp-sec{margin-top:5.2rem}
.lp-eyebrow{margin:0 0 .6rem;font-size:.82rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.lp-h2{font-family:var(--serif)!important;font-weight:500;font-size:clamp(28px,4.6vw,44px);line-height:1.12;letter-spacing:-.02em;margin:0 0 2rem;color:var(--ink);max-width:36rem}
.lp-h2.sm{font-size:clamp(24px,3.6vw,34px);margin-bottom:1.6rem}
.lp-p{font-size:1.04rem;line-height:1.65;color:var(--ink-2);margin:0;max-width:30rem}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease-calm),transform .8s var(--ease-calm)}
.rv.in{opacity:1;transform:none}

/* steps */
.lp-steps{list-style:none;margin:0;padding:0;display:grid;gap:1rem;counter-reset:s}
.lp-steps li{position:relative;overflow:hidden;padding:1.6rem 1.5rem 1.5rem;border-radius:22px;background:rgba(255,255,255,.72);border:1px solid var(--line-2);
  box-shadow:0 14px 34px -22px rgba(31,74,95,.4);backdrop-filter:blur(8px);transition:transform .35s var(--ease-calm),box-shadow .35s}
.lp-steps li:hover{transform:translateY(-4px);box-shadow:0 22px 40px -22px rgba(31,74,95,.5)}
.lp-steps .n{position:absolute;inset-block-start:-.6rem;inset-inline-end:.9rem;font-family:var(--serif);font-size:6.4rem;line-height:1;font-weight:500;color:var(--accent-soft);opacity:.9;pointer-events:none}
.lp-steps .ic{display:grid;place-items:center;width:3rem;height:3rem;border-radius:16px;margin-bottom:1rem;color:#fff;
  background:linear-gradient(145deg,#5FA6C2,var(--accent-deep));box-shadow:0 10px 20px -8px rgba(31,74,95,.55)}
.lp-steps .ic svg{width:1.55rem;height:1.55rem}
.lp-steps h3{position:relative;font-size:1.12rem;font-weight:700;margin:0 0 .35rem;color:var(--ink)}
.lp-steps p{position:relative;margin:0;font-size:.95rem;line-height:1.6;color:var(--ink-2)}
@media (min-width:760px){ .lp-steps{grid-template-columns:repeat(3,1fr);gap:1.2rem} }

/* breathing demo */
.lp-try{display:grid;gap:1.8rem;align-items:center;padding:2.2rem 1.6rem;border-radius:32px;color:#fff;overflow:hidden;position:relative;
  background:radial-gradient(40rem 26rem at 80% 30%,#2F6C86 0%,transparent 70%),linear-gradient(150deg,#1B4357 0%,#0F2B3A 100%);
  box-shadow:0 40px 80px -36px rgba(15,43,58,.7)}
.lp-try .lp-eyebrow{color:#9DD0E4}.lp-try .lp-h2{color:#fff;margin-bottom:1rem}.lp-try .lp-p{color:rgba(255,255,255,.76)}
.lp-breath{display:flex;flex-direction:column;align-items:center;gap:1rem}
.br-orb{position:relative;width:min(15.5rem,62vw);aspect-ratio:1;display:grid;place-items:center;transform:scale(.62);will-change:transform}
.br-core{position:absolute;inset:14%;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#F1FBFF 0%,#A9D9EC 38%,#4C9AB8 78%,#2D6F8B 100%);box-shadow:0 0 60px 8px rgba(120,196,225,.45),0 0 0 8px rgba(255,255,255,.07)}
.br-orb i{position:absolute;inset:6%;border-radius:50%;border:1.5px solid rgba(190,230,245,.5)}
.br-orb .r2{inset:-4%;border-color:rgba(190,230,245,.28)}
.lp-breath[data-state="idle"] .br-orb{animation:brIdle 5.5s ease-in-out infinite}
@keyframes brIdle{0%,100%{transform:scale(.62)}50%{transform:scale(.68)}}
.lp-breath[data-state="in"] .br-orb{transform:scale(1);transition:transform 4s cubic-bezier(.45,.05,.35,1)}
.lp-breath[data-state="out"] .br-orb{transform:scale(.62);transition:transform 6s cubic-bezier(.45,.05,.35,1)}
.br-word{margin:0;min-height:2.2rem;font-family:var(--serif);font-size:1.7rem;font-weight:500;color:#fff;letter-spacing:.01em;text-align:center}
html[data-theme] .btn.br-btn{background:#fff;color:var(--accent-deep);border-color:#fff;box-shadow:0 12px 26px -10px rgba(0,0,0,.5)}
html[data-theme] .btn.br-btn:hover{background:#E8F4F9}
@media (min-width:860px){ .lp-try{grid-template-columns:1fr 1fr;padding:3.2rem 3.4rem} }

/* sense cards */
.lp-cards{display:grid;gap:1rem}
.lp-card{padding:1.7rem 1.5rem;border-radius:24px;border:1px solid var(--line-2);position:relative;overflow:hidden;
  transition:transform .35s var(--ease-calm),box-shadow .35s;box-shadow:0 14px 34px -24px rgba(31,74,95,.45)}
.lp-card:hover{transform:translateY(-5px);box-shadow:0 26px 44px -26px rgba(31,74,95,.55)}
.lp-card.s1{background:linear-gradient(160deg,#DCEBF1,#F4F9FB 80%)}
.lp-card.s2{background:linear-gradient(160deg,#E2EEE5,#F7FBF8 80%)}
.lp-card.s3{background:linear-gradient(160deg,#EFE8DA,#FBF9F4 80%)}
.lp-card .ic{display:grid;place-items:center;width:3.4rem;height:3.4rem;border-radius:50%;margin-bottom:1.1rem;background:#fff;color:var(--accent-deep);box-shadow:0 10px 22px -10px rgba(31,74,95,.5)}
.lp-card .ic svg{width:1.7rem;height:1.7rem}
.lp-card h3{font-family:var(--serif);font-size:1.4rem;font-weight:500;margin:0 0 .5rem;color:var(--ink)}
.lp-card p{margin:0;font-size:.97rem;line-height:1.62;color:var(--ink-2)}
@media (min-width:760px){ .lp-cards{grid-template-columns:repeat(3,1fr);gap:1.2rem} }

/* two modes */
.lp-two{display:grid;gap:1.1rem}
.lp-mode{padding:1.5rem;border-radius:26px;border:1px solid var(--line-2);background:rgba(255,255,255,.78);box-shadow:0 18px 40px -26px rgba(31,74,95,.5)}
.lp-mode h3{font-family:var(--serif);font-size:1.5rem;font-weight:500;margin:1.2rem 0 .4rem;color:var(--ink)}
.lp-mode p{margin:0;font-size:.97rem;line-height:1.62;color:var(--ink-2)}
.lp-mode-art{position:relative;height:11.5rem;border-radius:20px;display:grid;place-items:center;overflow:hidden}
.lp-mode.kid .lp-mode-art{background:radial-gradient(circle at 50% 70%,#E5F1D9,#CFE3E9 75%)}
.lp-mode.adult .lp-mode-art{background:linear-gradient(160deg,#F4F7F8,#E2EBEF)}
#lp-calmi2{width:8.4rem;height:8.4rem;margin-top:1.4rem}#lp-calmi2 svg{width:100%;height:100%;overflow:visible}
.lp-bubble{position:absolute;top:.9rem;inset-inline-start:1.1rem;padding:.5rem .9rem;border-radius:16px 16px 16px 4px;background:#fff;font-weight:700;font-size:.88rem;color:var(--accent-deep);box-shadow:0 10px 20px -10px rgba(31,74,95,.5)}
html[dir="rtl"] .lp-bubble{border-radius:16px 16px 4px 16px}
.lp-mock{width:62%;max-width:15rem;padding:1.1rem 1.2rem;border-radius:18px;background:#fff;box-shadow:0 18px 34px -18px rgba(31,74,95,.55);display:grid;gap:.65rem;justify-items:center}
.m-bar{justify-self:stretch;height:.5rem;border-radius:99px;background:linear-gradient(90deg,var(--accent) 62%,var(--accent-soft) 62%)}
.m-ring{position:relative;width:4.2rem;height:4.2rem;border-radius:50%;border:5px solid var(--accent-soft);display:grid;place-items:center;margin:.2rem 0}
.m-ring i{width:1.4rem;height:1.4rem;border-radius:50%;background:var(--accent);animation:brIdle 5.5s ease-in-out infinite}
.m-line{justify-self:stretch;height:.5rem;border-radius:99px;background:var(--line)}.m-line.s{width:60%;justify-self:center}
@media (min-width:760px){ .lp-two{grid-template-columns:1fr 1fr;gap:1.3rem} .lp-mode{padding:1.7rem} }

/* privacy */
.lp-priv ul{list-style:none;margin:0;padding:0;display:grid;gap:1.4rem}
.lp-priv li{padding-top:1.1rem;border-top:2px solid var(--accent)}
.lp-priv strong{display:block;font-size:1.08rem;margin-bottom:.35rem;color:var(--ink)}
.lp-priv span{display:block;font-size:.96rem;line-height:1.62;color:var(--ink-2)}
@media (min-width:760px){ .lp-priv ul{grid-template-columns:repeat(3,1fr);gap:2rem} }

/* closing band */
.lp-final{margin-top:5.2rem;padding:3rem 1.6rem;border-radius:32px;text-align:center;color:#fff;display:grid;justify-items:center;gap:1.6rem;position:relative;overflow:hidden;

html[data-theme] .lp-final .btn:hover{background:#E8F4F9}
.lp-disc{text-align:center;font-size:.78rem;color:var(--ink-3);margin:1.6rem 0 0;padding-inline:1rem}

@media (prefers-reduced-motion:reduce){

  .rv{opacity:1;transform:none;transition:none}
  .lp-breath[data-state="in"] .br-orb,.lp-breath[data-state="out"] .br-orb{transition-duration:.01s}
}

   2 · AUDIO ENGINE — everything synthesised, nothing downloaded
================================================================== */
const Audio_ = {
  ctx:null, master:null, comp:null, nodes:[], vol:0.55, enabled:true, started:false,

  init(){
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try{
      this.ctx = new AC();
      this.comp = this.ctx.createDynamicsCompressor();
      this.comp.threshold.value = -18; this.comp.ratio.value = 6;
      this.master = this.ctx.createGain();
      this.master.gain.value = 0;
      this.master.connect(this.comp); this.comp.connect(this.ctx.destination);
      return true;
    }catch(e){ return false; }
  },
  resume(){ if(this.ctx && this.ctx.state === 'suspended'){ this.ctx.resume().catch(function(){}); } },
  now(){ return this.ctx ? this.ctx.currentTime : 0; },
  setVol(v){
    this.vol = v;
    if(this.master) this.master.gain.linearRampToValueAtTime(this.enabled ? v*0.55 : 0, this.now()+0.4);
  },
  fadeIn(sec){ if(this.master) this.master.gain.linearRampToValueAtTime(this.enabled?this.vol*0.55:0, this.now()+(sec||2.5)); },
  fadeOut(sec){ if(this.master) this.master.gain.linearRampToValueAtTime(0, this.now()+(sec||1.5)); },

  noiseBuffer(kind){
    const ctx=this.ctx, len=ctx.sampleRate*4, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    if(kind==='brown'){
      let last=0;
      for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.2; }
    }else{ // pink-ish
      let b0=0,b1=0,b2=0;
      for(let i=0;i<len;i++){ const w=Math.random()*2-1;
        b0=0.99765*b0+w*0.0990460; b1=0.96300*b1+w*0.0663396; b2=0.57000*b2+w*0.0750759;
        d[i]=(b0+b1+b2+w*0.1848)*0.25; }
    }
    return buf;
  },

  // Continuous soft noise bed; returns a gain node you can swell
  bed(kind, cutoff){
    if(!this.init()) return null;
    const src=this.ctx.createBufferSource();
    src.buffer=this.noiseBuffer(kind||'brown'); src.loop=true;
    const lp=this.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=cutoff||520; lp.Q.value=0.6;
    const g=this.ctx.createGain(); g.gain.value=0.0001;
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start();
    this.nodes.push(src,lp,g);
    return {gain:g, filter:lp};
  },

  drone(freq){
    if(!this.init()) return null;
    const g=this.ctx.createGain(); g.gain.value=0.0001;
    const lp=this.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700;
    [0,-0.6,0.7].forEach((det,i)=>{
      const o=this.ctx.createOscillator(); o.type='sine';
      o.frequency.value=(freq||96)*(i===2?2:1); o.detune.value=det*8;
      const og=this.ctx.createGain(); og.gain.value=i===2?0.12:0.4;
      o.connect(og); og.connect(lp); o.start(); this.nodes.push(o,og);
    });
    lp.connect(g); g.connect(this.master); this.nodes.push(lp,g);
    return {gain:g};
  },

  binaural(carrier, beat){
    if(!this.init()) return null;
    const g=this.ctx.createGain(); g.gain.value=0.0001; g.connect(this.master);
    [[carrier,-1],[carrier+beat,1]].forEach(pair=>{
      const o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=pair[0];
      const p=this.ctx.createStereoPanner?this.ctx.createStereoPanner():null;
      const og=this.ctx.createGain(); og.gain.value=0.5;
      o.connect(og); if(p){ p.pan.value=pair[1]; og.connect(p); p.connect(g); } else { og.connect(g); }
      o.start(); this.nodes.push(o,og); if(p) this.nodes.push(p);
    });
    this.nodes.push(g);
    return {gain:g};
  },

  ping(freq,len){
    const bus=this.voiceBus(); if(!bus) return;
    this.resume();
    const t=this.now(), o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='sine'; o.frequency.value=freq||528;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(len||1.4));
    o.connect(g); g.connect(bus); o.start(t); o.stop(t+(len||1.4)+0.05);
  },
  chime(freq, len){
    if(!this.init()||!this.enabled) return;
    const t=this.now(), o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='sine'; o.frequency.value=freq||528;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.16,t+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(len||2.4));
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+(len||2.4)+0.1);
  },

  swell(node, target, sec){
    if(!node) return;
    const t=this.now();
    node.gain.gain.cancelScheduledValues(t);
    node.gain.gain.setValueAtTime(Math.max(node.gain.gain.value,0.0001),t);
    node.gain.gain.exponentialRampToValueAtTime(Math.max(target,0.0001), t+Math.max(sec,0.05));
  },
  sweep(node, freq, sec){
    if(!node||!node.filter) return;
    const t=this.now();
    node.filter.frequency.cancelScheduledValues(t);
    node.filter.frequency.setValueAtTime(node.filter.frequency.value,t);
    node.filter.frequency.linearRampToValueAtTime(freq, t+Math.max(sec,0.05));
  },
  meter(){
    if(!this.init()) return null;
    if(!this._an){
      this._an=this.ctx.createAnalyser();
      this._an.fftSize=256;
      this._an.connect(this.ctx.destination);   // pass-through so we can measure what leaves
    }
    return this._an;
  },
  level(){
    if(!this._an) return 0;
    const buf=new Uint8Array(this._an.fftSize);
    this._an.getByteTimeDomainData(buf);
    let peak=0;
    for(let i=0;i<buf.length;i++){ const v=Math.abs(buf[i]-128)/128; if(v>peak) peak=v; }
    return peak;
  },
  /* Calmi's voice: a sawtooth glottal source shaped by two vowel formants,
     one short note per character, pitched into a sentence contour.
     Pure Web Audio — no speech engine, no installed voice, no permission needed.
     The formant filters cut most of the energy, so each band carries its own
     makeup gain; without it the voice renders at 1.5% amplitude and is inaudible. */
  speak(text, cfg){
    const bus=this.voiceBus(); if(!bus||!text) return 0;
    this.resume();
    const c=cfg||{}, per=c.per||0.06, base=c.base||330, vol=c.vol||0.16;
    const F1=c.f1||700, F2=c.f2||1300;
    const t0=this.now()+0.04, chars=String(text).split(''), ctx=this.ctx;
    for(let i=0;i<chars.length;i++){
      const ch=chars[i];
      if(!ch.trim()) continue;
      if('.,!?;:\u2014'.indexOf(ch)>=0) continue;
      const t=t0+i*per;
      const o=ctx.createOscillator(); o.type='sawtooth';
      const jitter=((ch.charCodeAt(0)*37)%9)-4;
      const contour=Math.sin(i*0.33)*16-(i/chars.length)*20;
      o.frequency.setValueAtTime(Math.max(110, base+jitter*7+contour), t);

      const sum=ctx.createGain(); sum.gain.value=1;
      [[F1,4,8],[F2,5,4.8]].forEach(function(f){
        const bp=ctx.createBiquadFilter(); bp.type='bandpass';
        bp.frequency.value=f[0]; bp.Q.value=f[1];
        const mk=ctx.createGain(); mk.gain.value=f[2];      // makeup for what the filter removed
        o.connect(bp); bp.connect(mk); mk.connect(sum);
      });

      const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol, t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t+per*0.86);
      sum.connect(g); g.connect(bus);
      o.start(t); o.stop(t+per);
    }
    return chars.length*per;
  },
  voiceBus(){
    if(!this.init()) return null;
    if(!this._vb){
      this._vb=this.ctx.createGain(); this._vb.gain.value=0.6;
      this._vb.connect(this.comp);
      const an=this.meter(); if(an) this._vb.connect(an);
    }
    return this._vb;
  },
  blip(i){
    const bus=this.voiceBus(); if(!bus) return;
    this.resume();
    const t=this.now(), o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='sine'; o.frequency.value=470+((i*53)%210);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.07,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t+0.13);
  },
  duck(on){
    if(!this.master) return;
    this.master.gain.linearRampToValueAtTime(this.enabled?(this.vol*(on?0.16:0.55)):0, this.now()+0.35);
  },
  stopAll(){
    this.fadeOut(1.2);
    const list=this.nodes.slice(); this.nodes=[];
    setTimeout(()=>{ list.forEach(n=>{ try{ n.stop&&n.stop(); }catch(e){} try{ n.disconnect(); }catch(e){} }); },1400);
  }
};

/* 2b · Calmi's synthesised babble used to live here. It was removed:
   a voice that cannot form words is indistinguishable from a broken app,
   and it was the source of the "gibberish" in the adult guidance. If no real
   voice is installed, the app now runs silently and says so. */

/* ==================================================================
   3 · VOICE — natural prosody, and every browser workaround it needs
================================================================== */
const Voice = {
  on:true,
  vol:1,                        // user-set voice volume, 0–1
  mode:'human',                 // 'human' = the device's own voice, real words · 'calmi' = synthesised babble · 'off'
  supported:('speechSynthesis' in window),
  unlocked:false, voices:[], picked:{}, chosen:null, chosenBy:{}, missing:{},
  rate:1,                       // user-set speed multiplier, 0.8–1.2
  _keep:0, _safety:0, _speaking:false, _everSpoke:false, _seq:0,

  load(){
    if(!this.supported) return;
    try{ this.voices = window.speechSynthesis.getVoices() || []; }catch(e){ this.voices=[]; }
  },

  /* Browsers refuse to speak until a real user gesture has produced an utterance.
     Burn a silent one on the very first tap so later speech is allowed. */
  unlock(){
    if(!this.supported || this.unlocked) return;
    try{
      const u=new SpeechSynthesisUtterance(' ');
      u.volume=0; u.rate=1.4;
      window.speechSynthesis.speak(u);
      this.unlocked=true;
      this.keepAlive();
    }catch(e){}
  },

  /* Chrome silently suspends synthesis after ~15s. pause+resume revives it. */
  keepAlive(){
    if(this._keep) return;
    const self=this;
    this._keep=window.setInterval(function(){
      try{
        if(window.speechSynthesis.speaking && self._speaking){
          window.speechSynthesis.pause(); window.speechSynthesis.resume();
        }
      }catch(e){}
    },9000);
  },

  listFor(lang){
    if(!this.voices.length) this.load();
    const want = (lang==='he') ? 'he' : 'en';
    return this.voices.filter(function(v){
      return (v.lang||'').toLowerCase().replace('_','-').indexOf(want)===0;
    });
  },
  /* Is there a voice on this device that can actually say these words? */
  has(lang){ return this.supported && this.listFor(lang).length>0; },
  /* Choose the mode automatically: real words whenever the device can produce them. */
  autoMode(){
    this.load();
    if(this.mode==='off') return this.mode;          // an explicit mute is respected
    this.mode = 'human';    // there is exactly one voice engine now: real speech or nothing
    return this.mode;
  },

  pick(lang,persona){
    if(!this.supported) return null;
    if(!this.voices.length) this.load();
    // A voice chosen for one language must never be used for the other —
    // an English voice reading Hebrew is exactly what "a computer mangling
    // Hebrew" sounds like. Choices are remembered per language.
    const want=(lang==='he')?'he':'en';
    const sel=this.chosenBy[lang];
    if(sel){
      const c=this.voices.filter(function(v){ return v.voiceURI===sel; })[0];
      if(c && (c.lang||'').toLowerCase().replace('_','-').indexOf(want)===0) return c;
    }
    const key=lang+'|'+persona;
    if(this.picked[key]) return this.picked[key];
    if(!this.voices.length) return 'default';   // no list exposed — let the browser pick
    let pool=this.listFor(lang);
    // No voice listed for this language: still try, with the language hint — many
    // browsers resolve one internally. Silence is the one outcome we never want.
    // Hebrew has no fallback: an English engine reading Hebrew letters is
    // worse than silence. English may fall back, since almost every device
    // has some English voice.
    if(!pool.length){ this.missing[lang]=true; return (lang==='he') ? null : 'default'; }
    this.missing[lang]=false;
    const good=/natural|neural|premium|enhanced|siri|google|carmit|samantha|ava|allison|serena|zoe|nicky|karen|moira|tessa|aria|jenny|sonia/i;
    const great=/premium|enhanced|natural|neural|siri/i;
    const bad=/compact|espeak|festival|zira|david|hazel|whisper|bells|bubbles|organ|trinoids|zarvox|albert|bad news|good news|jester|boing|wobble|superstar/i;
    const warm=/carmit|samantha|ava|allison|serena|zoe|nicky|karen|moira|tessa|aria|jenny|sonia|female/i;
    const scored=pool.map(function(v){
      let sc=0; const n=v.name||'';
      if(good.test(n)) sc+=6;
      if(great.test(n)) sc+=9;      // the downloadable high-quality variants
      if(bad.test(n)) sc-=8;
      if(warm.test(n)) sc+=4;
      if(v.localService===false) sc+=2;
      if((v.lang||'').toLowerCase().indexOf('en-us')===0 && lang!=='he') sc+=1;
      return {v:v,s:sc};

  clauses(text){

    if(!v){ onEnd&&onEnd(); return; }          // no voice for this language on this device

    try{ window.speechSynthesis.cancel(); }catch(e){}
    Audio_.duck(true);
    window.clearTimeout(this._safety);

    this._seq=(this._seq||0)+1;
    const seq=this._seq;

    /* A whole sentence pushed through the engine in one breath is a large part
       of what makes it sound like a machine reading aloud: the engine runs the
       comma straight through. Handing it one clause at a time and holding the
       pause here instead gives the same engine the rhythm of someone talking. */
    let cursor=0;
    const parts=this.clauses(text).map(function(p){
      const at=text.indexOf(p,cursor), pos=at<0?cursor:at;
      cursor=pos+p.length;
      return {t:p, at:pos};
    });
    let i=0;

    function finish(){
      if(self.onWord) self.onWord(text.length);
      window.clearTimeout(self._safety); Audio_.duck(false);
      self._speaking=false; onEnd&&onEnd();
    }
    function next(){
      if(seq!==self._seq) return;          // a newer line has taken over
      if(i>=parts.length){ finish(); return; }
      const part=parts[i]; i++;
      const u=new SpeechSynthesisUtterance(part.t);
      if(v && v!=='default'){ try{ u.voice=v; }catch(e){} }   // a stale voice must not mute the app
      u.lang=(v&&v!=='default'&&v.lang)||(lang==='he'?'he-IL':'en-US');
      // Hebrew voices degrade badly when pitch-shifted — that is what makes them sound synthetic.
      const he=(u.lang||'').toLowerCase().indexOf('he')===0;
      const soft = !!Voice.soft;                    // hearing is the flooded channel
      const vv = Math.max(0, Math.min(1, Voice.vol)) * (soft?0.35:1);
      // Rate is the single biggest cause of "it sounds like a machine".
      // Hebrew voices in particular fall apart below ~0.9 — the vowels stretch
      // and the words stop joining up. These are close to natural speed, and
      // the pacing comes from the pauses between lines, not from a drawl.
      const mul = Math.max(0.7, Math.min(1.25, Voice.rate||1)) * (soft?0.94:1);
      if(persona==='child'){ u.rate = (he?1.0:1.02) * mul; u.pitch = he?1.0:1.1; u.volume=vv; }
      else { u.rate = (he?0.95:0.92) * mul; u.pitch = he?1.0:0.97; u.volume=vv; }
      u.onstart=function(){ self._everSpoke=true; self._startedNow=true;
        if(self.onWord && part.at===0) self.onWord(0); };
      u.onboundary=function(ev){                      // the engine reports where it is in the clause
        self._gotBoundary=true;
        if(self.onWord && typeof ev.charIndex==='number')
          self.onWord(part.at+ev.charIndex+(ev.charLength||0));
      };
      u.onend=function(){
        if(seq!==self._seq) return;
        if(self.onWord) self.onWord(Math.min(text.length, part.at+part.t.length));
        // the pause that makes a comma sound like a breath rather than a gap
        if(i>=parts.length) finish(); else window.setTimeout(next,190);
      };
      u.onerror=function(){
        if(seq!==self._seq) return;
        if(i>=parts.length) finish(); else window.setTimeout(next,60);
      };
      try{ window.speechSynthesis.speak(u); }
      catch(e){ finish(); }
    }
    /* cancel() and speak() in the same tick is swallowed by Chrome — let it breathe */
    window.setTimeout(next,120);
  },

  stop(){
    window.clearTimeout(this._safety);
    this._seq=(this._seq||0)+1;          // abandons any clause still queued
    try{ RecVoice.stop(); }catch(e){}
    this.onWord=null;
    this._speaking=false;
    if(this.supported){ try{ window.speechSynthesis.cancel(); }catch(e){} }
    Audio_.duck(false);
  }
};

const VOICED={};
(function(){
  Object.keys(VOICED_SET).forEach(function(id){
    const set=VOICED_SET[id];

/* Pull every shipped line into the browser cache before a session starts, so
   the first cue does not wait on a round trip. Warming is all this does — it
   cannot make the app speak and cannot make it silent. */
const Voiced = {
  warmed:{}, nodes:{}, _q:[], _live:0,
  /* A few at a time, in the order the session will need them. Firing all of a
     persona's lines at once would put the opening cue behind forty other
     requests on a slow connection, which is the opposite of the point. */
  warm(lang,persona){
    const id=lang+'|'+persona;
    if(this.warmed[id]) return;
    this.warmed[id]=true;
    const self=this, order=REC_KEYS[persona]||[];
    order.forEach(function(k){
      const full=id+'|'+k;
      if(VOICED[full] && !self.nodes[full]) self._q.push(full);
    });
    // the rotating takes and the encouragements come after the first pass —
    // none of them is needed before the opening cue has already played
    Object.keys(VOICED).forEach(function(full){
      if(full.indexOf(id+'|')!==0) return;
      if(self.nodes[full] || self._q.indexOf(full)>=0) return;
      self._q.push(full);
    });
    this._pump();
  },
  _pump(){
    const self=this;
    while(this._live<3 && this._q.length){
      const k=this._q.shift();
      try{
        const a=document.createElement('audio');
        a.preload='auto'; a.src=VOICED[k].url;
        this.nodes[k]=a; this._live++;
        const done=function(){ a.oncanplaythrough=null; a.onerror=null;
          self._live--; self._pump(); };
        a.oncanplaythrough=done; a.onerror=done;
        a.load();
      }catch(e){ this._live--; }
    }
  },
  /* how many of a persona's lines a real voice can say */
  count(lang,persona){
    const pre=lang+'|'+persona+'|';
    return Object.keys(VOICED).filter(function(k){ return k.indexOf(pre)===0; }).length;
  }
};

const RecVoice = {
  on:true, clips:{}, db:null, where:'mem', ready:false, el:null, failed:{}, ns:'', src:'auto',
  dbName(){ return 'systemcalm-voice'+(this.ns?'-'+this.ns:''); },
  lsKey(){ return 'systemcalm.voice'+(this.ns?'.'+this.ns:''); },
  supported:(typeof window!=='undefined' && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && typeof window.MediaRecorder!=='undefined'),

  id(lang,persona,key){ return lang+'|'+persona+'|'+key; },

  takeId(lang,persona,key,n,room){

    if(this.clips[id]) return this.clips[id];
    if(this.failed[id]) return null;
    return VOICED[id] || null;
  },
  usable(lang,persona,key){ return this.on && !!this.pick(this.id(lang,persona,key)); },
  count(lang,persona){ const self=this;
    return REC_KEYS[persona].filter(function(k){ return !!self.clips[self.id(lang,persona,k)]; }).length; },
  voicedCount(lang,persona){ const self=this;
    return REC_KEYS[persona].filter(function(k){
      return !!VOICED[self.id(lang,persona,k)]; }).length; },

  /* IndexedDB first; localStorage if it is blocked; memory as the last resort.
     Which one we landed on is shown to the user — a recording that silently
     disappears when the tab closes is worse than no recording. */
  open(){
    const self=this;
    return new Promise(function(res){
      try{
        const rq=window.indexedDB.open(self.dbName(),1);
        rq.onupgradeneeded=function(e){ try{ e.target.result.createObjectStore('clips'); }catch(x){} };
        rq.onsuccess=function(e){ self.db=e.target.result; self.where='db'; res(true); };
        rq.onerror=function(){ res(false); };
        rq.onblocked=function(){ res(false); };
        window.setTimeout(function(){ if(!self.db) res(false); },1500);
      }catch(e){ res(false); }
    });
  },
  load(){
    const self=this;
    return this.open().then(function(ok){
      // anything recorded before storage finished opening is merged in, never
      // clobbered — a lost recording is a person's voice, not a cache entry
      const pending=self.clips; self.clips={};
      const merge=function(){
        Object.keys(pending).forEach(function(k){ self.clips[k]=pending[k]; self.persist(k,pending[k]); });
        self.ready=true;
      };
      if(ok && self.db){
        return new Promise(function(res){
          try{
            const tx=self.db.transaction('clips','readonly').objectStore('clips').openCursor();
            tx.onsuccess=function(e){ const c=e.target.result;
              if(c){ self.clips[c.key]=c.value; c.continue(); } else { merge(); res(); } };
            tx.onerror=function(){ merge(); res(); };
          }catch(e){ merge(); res(); }
        });
      }
      try{
        const raw=window.localStorage.getItem(self.lsKey());
        if(raw){ self.clips=JSON.parse(raw)||{}; }
        window.localStorage.setItem('systemcalm.probe','1');
        window.localStorage.removeItem('systemcalm.probe');
        self.where='ls';
      }catch(e){ self.where='mem'; }
      merge();
    });
  },
  put(id,rec){ this.clips[id]=rec; this.persist(id,rec); },
  /* Try every store in turn rather than trusting a flag set at boot: on
     file:// URLs IndexedDB is available in one browser and blocked in the next. */
  persist(id,rec){
    if(this.db){
      try{ this.db.transaction('clips','readwrite').objectStore('clips').put(rec,id); this.where='db'; return; }catch(e){}
    }
    try{ window.localStorage.setItem(this.lsKey(),JSON.stringify(this.clips)); this.where='ls'; return; }catch(e){}
    this.where='mem';
  },
  del(id){
    delete this.clips[id];
    if(this.db){ try{ this.db.transaction('clips','readwrite').objectStore('clips').delete(id); }catch(e){} }
    try{ window.localStorage.setItem(this.lsKey(),JSON.stringify(this.clips)); }catch(e){}
  },
  wipe(lang,persona){
    const self=this;
    REC_KEYS[persona].forEach(function(k){ self.del(self.id(lang,persona,k)); });
  },

  node(){
    if(!this.el){
      this.el=document.createElement('audio');
      this.el.preload='auto';
      this.el.setAttribute('playsinline','');
      document.body.appendChild(this.el);
    }
    return this.el;
  },
  stop(){ window.clearInterval(this._slice); try{ const a=this.el; if(a){ a.pause(); } }catch(e){} },
  /* Returns the clip length in seconds so the on-screen text can be revealed
     at the pace of the actual audio. */
  busyUntil:0,
  speaking(){ return Date.now() < this.busyUntil; },
  play(lang,persona,key,onEnd,onFail,n,room){
    const self=this, id=this.takeId(lang,persona,key,n,room);
    const rec=this.pick(id);
    if(!rec) { onEnd&&onEnd(); return 0; }
    this.busyUntil = Date.now() + ((rec.dur||1.4)*1000);
    const a=this.node();
    try{ a.pause(); }catch(e){}
    const src=rec.b64 || rec.url;
    if(a.getAttribute('data-src')!==src){ a.src=src; a.setAttribute('data-src',src); }
    a.volume=Math.max(0,Math.min(1,(Voice.vol==null?1:Voice.vol) * (Voice.soft?0.35:1)));
    Audio_.duck(true);
    let done=false;
    window.clearInterval(this._slice);
    const giveUp=function(){
      if(done) return; done=true;
      Audio_.duck(false);
      // a shipped line that will not load hands this line back to the engine,
      // this time and every time after
      if(!self.clips[id]){ self.failed[id]=true; if(onFail){ onFail(); return; } }
      onEnd&&onEnd();
    };
    const stop=function(){
      if(done) return; done=true;
      window.clearInterval(self._slice);
      try{ a.pause(); }catch(e){}
      Audio_.duck(false); onEnd&&onEnd();
    };
    a.onended=stop;
    a.onerror=giveUp;
    // a line inside a longer take: start at its offset and stop at its end
    if(rec.start!=null){
      try{ a.currentTime=rec.start; }catch(e){}
      this._slice=window.setInterval(function(){
        if(a.currentTime>=rec.end-0.02) stop();
      },30);
    }
    try{ const pr=a.play(); if(pr&&pr.catch) pr.catch(giveUp); }
    catch(e){ giveUp(); }
    return rec.dur||1.4;
  },

  /* ---- recording ---- */
  rec:null, stream:null, recId:null,
  start(id,onDone){
    const self=this;
    if(!this.supported) { onDone&&onDone(false,'unsupported'); return; }
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(st){
      self.stream=st;
      let mr;
      try{ mr=new MediaRecorder(st); }catch(e){ try{ mr=new MediaRecorder(st,{mimeType:'audio/webm'}); }catch(x){ onDone&&onDone(false,'unsupported'); return; } }
      const chunks=[]; const t0=Date.now();
      mr.ondataavailable=function(e){ if(e.data && e.data.size) chunks.push(e.data); };
      mr.onstop=function(){
        try{ st.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
        const blob=new Blob(chunks,{type:(mr.mimeType||'audio/webm')});
        const fr=new FileReader();
        fr.onload=function(){
          self.put(id,{b64:fr.result, dur:Math.max(0.4,(Date.now()-t0)/1000-0.15), type:blob.type});
          onDone&&onDone(true);
        };
        fr.onerror=function(){ onDone&&onDone(false,'read'); };
        fr.readAsDataURL(blob);
      };
      self.rec=mr; self.recId=id;
      mr.start();
    }).catch(function(){ onDone&&onDone(false,'denied'); });
  },
  finish(){ try{ if(this.rec && this.rec.state!=='inactive') this.rec.stop(); }catch(e){} this.rec=null; },
  recording(){ return !!(this.rec && this.rec.state==='recording'); },

  /* ---- one file in, one file out, so a set survives anything ---- */
  exportAll(){
    const data=JSON.stringify({v:1, app:'SystemCalm AI', clips:this.clips});
    const fallback=function(){
      try{
        const blob=new Blob([data],{type:'application/json'});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download='systemcalm-voice.json';
        document.body.appendChild(a); a.click();
        window.setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },400);
      }catch(e){}
    };
    try{
      if(window.claude && typeof window.claude.use==='function'){
        window.claude.use('downloads').then(function(d){
          if(d && d.save) d.save({filename:'systemcalm-voice.json', data:data}).catch(fallback);
          else fallback();
        }).catch(fallback);
        return;
      }
    }catch(e){}
    fallback();
  },
  importAll(file,done){
    const self=this, fr=new FileReader();
    fr.onload=function(){
      try{
        const j=JSON.parse(fr.result);
        const c=j&&j.clips; let n=0;
        if(c) Object.keys(c).forEach(function(k){ if(c[k]&&c[k].b64){ self.put(k,c[k]); n++; } });
        done&&done(n);
      }catch(e){ done&&done(-1); }
    };
    fr.onerror=function(){ done&&done(-1); };
    fr.readAsText(file);
  },
  importClip(id,file,done){
    const self=this, fr=new FileReader();
    fr.onload=function(){ self.put(id,{b64:fr.result, dur:0, type:file.type||'audio/mpeg'});
      // read the real duration so text reveal matches the audio
      try{ const a=new Audio(); a.src=fr.result;
        a.onloadedmetadata=function(){ const r=self.clips[id]; if(r && isFinite(a.duration)) { r.dur=a.duration; self.put(id,r); } done&&done(true); };
        a.onerror=function(){ done&&done(true); };
      }catch(e){ done&&done(true); }
    };
    fr.onerror=function(){ done&&done(false); };
    fr.readAsDataURL(file);
  }
};

const Calmi = {
  node(){ return el.stage.querySelector('.calmi'); },
  holder(){ return el.stage.querySelector('.calmi-holder'); },
  line(){ return el.stage.querySelector('.calmi-line'); },
  mood(m){ const n=this.node(); if(n && n.getAttribute('data-mood')!==m) n.setAttribute('data-mood',m); },
  scale(v,dur){ const h=this.holder(); if(!h) return; h.classList.remove('squash');
    h.style.transitionDuration=(dur||3)+'s'; h.style.transform='scale('+v+')'; },
  squash(on,dur){ const h=this.holder(); if(!h) return;
    h.style.transitionDuration=(dur||3)+'s';
    if(on){ h.classList.add('squash'); } else { h.classList.remove('squash'); h.style.transform='scale(1)'; } },
  tap(side){ const n=this.node(); if(!n) return;
    n.classList.toggle('tap-l',side==='l'); n.classList.toggle('tap-r',side==='r'); },
  cheer(on){ const n=this.node(); if(n) n.classList.toggle('cheer',!!on); },
  _tw:0, _said:{},
  say(text,speak,spokenText,key){
    if(!text) return;
    text = nm(text);
    // a recorded greeting says the original name, so once the child has renamed Calmi it is shown but not played
    if(state.calmiName && (key==='ready'||key==='readyQuiet')){ speak=false; key=null; }
    const said = nm(spokenText || text);
    const n=this.node(), l=this.line(), self=this;
    if(l){
      clearInterval(this._tw);
      l.textContent='';
      let i=0;
      if(n) n.classList.add('talking');
      let per=0.05, synced=false;

      if(speak && Session.voiceAllowed && Voice.on && Voice.mode!=='off'){
        if(key && RecVoice.usable(state.lang,'child',key)){
          // a real human voice always wins over the speech engine
          const rd=RecVoice.play(state.lang,'child',key,function(){
            setSpeaking(false); if(n) n.classList.remove('talking');
          }, function(){
            if(Voice.has(state.lang)) Voice.say(said, state.lang, 'child', function(){
              setSpeaking(false); if(n) n.classList.remove('talking');
            });
            else { setSpeaking(false); if(n) n.classList.remove('talking'); }
          }, (Session._cyc||1)-1, Session.voiceRoom(Session.i));
          per=Math.max(0.028, rd/Math.max(6,text.length));
          setSpeaking(true);
          window.clearTimeout(Calmi._spk);
          Calmi._spk=window.setTimeout(function(){ setSpeaking(false); }, rd*1000+250);
        } else if(Voice.mode==='human' && Voice.has(state.lang)){
          // let the speech engine drive the text: reveal exactly what it has just said
          synced=true;
          Voice.onWord=function(charIdx){
            const upto=Math.max(0,Math.min(text.length,charIdx));
            l.textContent=text.slice(0,upto);
          };
          Voice.say(said, state.lang, 'child', function(){
            l.textContent=text;
            Voice.onWord=null;
            setSpeaking(false);
            if(n) n.classList.remove('talking');
          });
          setSpeaking(true);
          // if the engine reports no boundaries (some voices do not), fall back to a timer
          window.clearTimeout(Calmi._sync);
          Calmi._sync=window.setTimeout(function(){
            if(!Voice._gotBoundary){
              Voice.onWord=null;
              let j=l.textContent.length;
              clearInterval(self._tw);
              self._tw=setInterval(function(){
                l.textContent=text.slice(0,++j);
                if(j>=text.length) clearInterval(self._tw);
              }, 62);
            }
          },700);
          window.clearTimeout(Calmi._spk);
          Calmi._spk=window.setTimeout(function(){ setSpeaking(false); }, text.length*90+1500);
        }
      }

      if(!synced){
        this._tw=setInterval(function(){
          l.textContent=text.slice(0,++i);
          if(i>=text.length){ clearInterval(self._tw);
            if(n && !self._speaking) setTimeout(function(){ n.classList.remove('talking'); },240); }
        }, Math.round(per*1000));
      }
    }
    // (the spoken line is issued above, once, by whichever engine is active)
  },
  quiet(){ clearInterval(this._tw); this._speaking=false; this._said={};
    const n=this.node(); if(n) n.classList.remove('talking'); }
};

/* Calmi's own words — short, warm, first person.

   a dash or an ellipsis is exactly where Hebrew TTS falls apart. */

/* Speech engines read punctuation literally. Ellipses and dashes are exactly
   where Hebrew TTS turns into a machine reading a list. */
/* A cue repeated word-for-word forty times stops being a voice and becomes a
   metronome. Lines that repeat are written as a list and rotate. */
function rot(v,n){ return (Object.prototype.toString.call(v)==='[object Array]') ? v[n % v.length] : v; }

function ttsClean(txt){
  return String(txt)
    .replace(/\u2026/g, ',')
    .replace(/\s+[\u2014\u2013]\s+/g, ', ')
    .replace(/[\u00b7\u2022]/g, ',')
    .replace(/!/g, '.')
    .replace(/\s+([.,])/g, '$1')      // left behind when a name is dropped
    .replace(/,\s*,/g, ',')
    .replace(/^[\s,.]+/, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

function driveCalmi(p,T,dur){
  const lang=state.lang;
  const sleepy = state.overload==='visual';
  if(T.render==='orb'||T.render==='quiet'){
    if(p.k==='in') Calmi.scale(1.14,dur);
    else if(p.k==='sip') Calmi.scale(1.22,dur);
    else if(p.k==='out'||p.k==='hum') Calmi.scale(0.80,dur);
    else if(p.k!=='hold') Calmi.scale(1,Math.min(dur,2));
  }
  if(T.render==='press'){
    if(p.k==='press'||p.k==='tense') Calmi.squash(true,dur);
    else if(p.k==='soften'||p.k==='release') Calmi.squash(false,dur);
  }
  if(T.render==='pads'){
    Calmi.tap(p.k==='tapL'?'l':(p.k==='tapR'?'r':null));
  }
  Calmi.cheer(p.k==='done');
  Calmi.mood(p.k==='done'?'happy':(sleepy && (p.k==='listen'||p.k==='free'||p.k==='out')?'sleepy':'happy'));

  let line='';
  if(p.k==='ready') line=fill((Voice.soft?KID.readyQuiet:KID.ready)[lang],{name:firstName()});
  else if(p.text && (p.k==='tense'||p.k==='release')) line=p.text[lang]+' — '+KID[p.k][lang];
  else if(p.text) line=p.text[lang];
  else if(KID[p.k]) line=KID[p.k][lang];
  if(p.k==='in') Session._cyc=(Session._cyc||0)+1;
  let spoken=line;
  const K=KID[p.k];
  if(p.k==='step' && p.stext && p.stext[lang]) spoken=p.stext[lang];
  if(K && K.sp && K.sp[lang]){
    const base = rot(K.sp[lang], (Session._cyc||1)-1);
    spoken = (p.k==='ready') ? fill(base,{name:spokenName()}) : base;
    if(p.text && (p.k==='tense'||p.k==='release')) spoken = ((p.stext&&p.stext[lang])||p.text[lang])+'. '+base;
  }
  if(p.k==='ready' && Voice.soft && KID.readyQuiet.sp[lang]) spoken=fill(KID.readyQuiet.sp[lang],{name:spokenName()});
  // speak on every phase that is long enough to finish a sentence in
  const always = (p.k==='ready'||p.k==='done'||p.k==='step'||p.k==='tense'||p.k==='release');
  Calmi._said[p.k]=true;
  let recKey = (p.k==='ready' && Voice.soft) ? 'readyQuiet' : p.k;
  if(p.k==='out' && Session.midDue()){
    recKey='mid';
    line = KID.mid[lang] || line;
    spoken = (KID.mid.sp && KID.mid.sp[lang]) || line;
  }
  if(line) Calmi.say(line, always || dur>=1.2, spoken, recKey);
}

/* ==================================================================
   8c · STORE — real persistence when run as a file, memory otherwise
================================================================== */
const Store = {
  key:'systemcalm.v1', mem:{profiles:{}}, persists:true,
  read(){ try{ const r=window.localStorage.getItem(this.key); if(r) this.mem=JSON.parse(r)||{profiles:{}}; }
          catch(e){ this.persists=false; }
          if(!this.mem.profiles) this.mem.profiles={}; if(!this.mem.prefs) this.mem.prefs={}; },
  write(){ try{ window.localStorage.setItem(this.key, JSON.stringify(this.mem)); }catch(e){ this.persists=false; } },
  slug(n){ return String(n||'').trim().toLowerCase() || '\u2014'; },
  profile(name){
    const raw = (name!=null) ? name : state.name;
    const k=this.slug(raw);
    if(!this.mem.profiles[k]) this.mem.profiles[k]={name:raw||'', age:state.age, sessions:[], seen:[]};
    return this.mem.profiles[k];
  },
  all(){ const self=this; return Object.keys(this.mem.profiles).map(function(k){ return self.mem.profiles[k]; })
          .filter(function(p){ return p.sessions.length; }); },
  log(rec){ const pr=this.profile(); pr.age=state.age; if(state.name) pr.name=state.name;
    pr.sessions.push(rec); this.write(); return pr; },
  wipe(){ this.mem={profiles:{},prefs:this.mem.prefs||{}}; this.write(); }
};
Store.read();

const uniq=function(a){ return a.filter(function(v,i){ return a.indexOf(v)===i; }); };
const dayKey=function(t){ const d=new Date(t); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); };

function earnedBadges(p){ return BADGES.filter(function(b){ return b.test(p); }); }

function grantBadges(p){
  if(!p.seen) p.seen=[];
  const fresh=earnedBadges(p).filter(function(b){ return p.seen.indexOf(b.id)<0; });
  fresh.forEach(function(b){ p.seen.push(b.id); });
  Store.write();
  return fresh;
}
